    storage: 'Freeze 3+ months',
    cookingMethod: 'Stovetop',
    servings: 6,
    link: 'https://www.thegoldenbalance.com/recipes/recipe-d2r4p',
    ingredients: [
      'Bell pepper',
      'Onion',
      'Celery',
      'Carrot',
      'Garlic',
      'Jalapeño',
      'Tomato paste',
      'Lean beef',
      'Beef stock',
      'Tomato sauce',
      'Pasta'
    ],
    instructions: 'Food process veggies. Sauté with tomato paste and spices. Add beef. Add stock and tomato sauce. Simmer. Toss with pasta.',
    reheating: 'Microwave'
  },
  {
    id: 65,
    name: 'Halal Cart Chicken Over Rice',
    mealPrep: false,
    mealType: 'Lunch/Dinner',
    genre: 'Middle Eastern',
    storage: 'Refrigerate 3-5 days',
    cookingMethod: 'Stovetop',
    servings: 4,
    link: 'https://www.thegoldenbalance.com/recipes/recipe-title-mb3aa-zafs5',
    ingredients: [
      'Basmati rice',
      'Ghee',
      'Hot pepper paste',
      'Chicken thighs',
      'Spices',
      'Sour cream',
      'Mayo',
      'Vinegar',
      'Parsley',
      'Lemon'
    ],
    instructions: 'Cook spiced red rice. Marinate and sear chicken. Make white sauce. Serve chicken over rice with lettuce, tomato, white sauce.',
    reheating: 'Microwave'
  },
  {
    id: 66,
    name: 'Mango Habanero Chicken Tenders',
    mealPrep: false,
    mealType: 'Lunch/Dinner',
    genre: 'American Fusion',
    storage: 'Fresh - eat same day',
    cookingMethod: 'Deep Fry',
    servings: 4,
    link: 'https://www.thegoldenbalance.com/recipes/recipe-4t9e3',
    ingredients: [
      '2 lbs chicken tenders',
      'Flour',
      'Cornstarch',
      'Baking powder',
      'Sparkling water',
      'Habanero peppers',
      'Mango pulp',
      'Brown sugar',
      'Lime'
    ],
    instructions: 'Marinate tenders. Double dredge. Fry at 360°F then 375°F. Blend mango habanero sauce. Brush chicken.',
    reheating: 'Best fresh'
  }
];

        const Login = ({ onLogin }) => {
          const [pin, setPin] = useState('');
          const [error, setError] = useState('');

          const handleSubmit = (e) => {
            e.preventDefault();
            if (pin.length < 4) {
              setError('PIN must be at least 4 characters');
              return;
            }
            localStorage.setItem('familyPIN', pin);
            onLogin(pin);
          };

          return (
            <div className="h-screen gradient-bg flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                <div className="text-center mb-8">
                  <div className="w-20 h-20 bg-gradient-to-br from-blue-600 to-purple-600 rounded-full mx-auto mb-4 flex items-center justify-center">
                    <Users size={40} className="text-white" />
                  </div>
                  <h1 className="text-3xl font-bold text-gray-800 mb-2">Life Admin</h1>
                  <p className="text-gray-600">Family AI Assistant</p>
                </div>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">Enter Family PIN</label>
                    <input type="text" value={pin} onChange={(e) => setPin(e.target.value)} placeholder="e.g., NizamFamily2025" className="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" autoFocus />
                    {error && <p className="text-red-600 text-sm mt-2">{error}</p>}
                  </div>
                  <button type="submit" className="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:shadow-lg">Access</button>
                </form>
              </div>
            </div>
          );
        };

        const RecipeForm = ({ recipe, onSave, onCancel }) => {
          const [formData, setFormData] = useState(recipe || {
            name: '',
            mealPrep: true,
            mealType: 'Dinner',
            genre: 'Mexican',
            storage: 'Freeze 3+ months',
            cookingMethod: 'Stovetop',
            servings: 4,
            macros: { calories: '', protein: '', carbs: '', fat: '' },
            link: '',
            ingredients: [''],
            instructions: '',
            reheating: ''
          });

          const handleSubmit = (e) => {
            e.preventDefault();
            onSave(formData);
          };

          const addIngredient = () => {
            setFormData({ ...formData, ingredients: [...formData.ingredients, ''] });
          };

          const updateIngredient = (index, value) => {
            const newIngredients = [...formData.ingredients];
            newIngredients[index] = value;
            setFormData({ ...formData, ingredients: newIngredients });
          };

          const removeIngredient = (index) => {
            const newIngredients = formData.ingredients.filter((_, i) => i !== index);
            setFormData({ ...formData, ingredients: newIngredients });
          };

          return (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={onCancel}>
              <div className="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6" onClick={(e) => e.stopPropagation()}>
                <h2 className="text-2xl font-bold mb-4">{recipe ? 'Edit Recipe' : 'Add Recipe'}</h2>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <input type="text" placeholder="Recipe Name *" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full p-2 border rounded-lg" required />
                  
                  <div className="grid grid-cols-2 gap-2">
                    <select value={formData.genre} onChange={(e) => setFormData({...formData, genre: e.target.value})} className="p-2 border rounded-lg">
                      <option>Mexican</option>
                      <option>Italian</option>
                      <option>Indian</option>
                      <option>American</option>
                      <option>Asian</option>
                      <option>Mediterranean</option>
                      <option>Middle Eastern</option>
                      <option>Thai</option>
                    </select>
                    <input type="text" placeholder="Meal Type" value={formData.mealType} onChange={(e) => setFormData({...formData, mealType: e.target.value})} className="p-2 border rounded-lg" />
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <input type="number" placeholder="Servings" value={formData.servings} onChange={(e) => setFormData({...formData, servings: e.target.value})} className="p-2 border rounded-lg" />
                    <select value={formData.cookingMethod} onChange={(e) => setFormData({...formData, cookingMethod: e.target.value})} className="p-2 border rounded-lg">
                      <option>Stovetop</option>
                      <option>Oven</option>
                      <option>Slow Cooker</option>
                      <option>Sheet Pan</option>
                      <option>Grill</option>
                      <option>Air Fryer</option>
                      <option>Deep Fry</option>
                    </select>
                    <input type="text" placeholder="Storage" value={formData.storage} onChange={(e) => setFormData({...formData, storage: e.target.value})} className="p-2 border rounded-lg" />
                  </div>

                  <label className="flex items-center gap-2">
                    <input type="checkbox" checked={formData.mealPrep} onChange={(e) => setFormData({...formData, mealPrep: e.target.checked})} />
                    <span>Meal Prep Friendly</span>
                  </label>

                  <div>
                    <label className="font-bold block mb-2">Ingredients</label>
                    {formData.ingredients.map((ing, i) => (
                      <div key={i} className="flex gap-2 mb-2">
                        <input type="text" value={ing} onChange={(e) => updateIngredient(i, e.target.value)} placeholder={`Ingredient ${i + 1}`} className="flex-1 p-2 border rounded-lg" />
                        {formData.ingredients.length > 1 && (
                          <button type="button" onClick={() => removeIngredient(i)} className="text-red-600 px-2"><Trash2 size={20} /></button>
                        )}
                      </div>
                    ))}
                    <button type="button" onClick={addIngredient} className="text-blue-600 text-sm flex items-center gap-1">
                      <Plus size={16} /> Add Ingredient
                    </button>
                  </div>

                  <textarea placeholder="Instructions" value={formData.instructions} onChange={(e) => setFormData({...formData, instructions: e.target.value})} className="w-full p-2 border rounded-lg" rows="3"></textarea>
                  
                  <input type="text" placeholder="Reheating instructions" value={formData.reheating} onChange={(e) => setFormData({...formData, reheating: e.target.value})} className="w-full p-2 border rounded-lg" />
                  
                  <input type="url" placeholder="Recipe Link (optional)" value={formData.link} onChange={(e) => setFormData({...formData, link: e.target.value})} className="w-full p-2 border rounded-lg" />

                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 gradient-bg text-white py-2 rounded-lg">Save</button>
                    <button type="button" onClick={onCancel} className="flex-1 bg-gray-200 py-2 rounded-lg">Cancel</button>
                  </div>
                </form>
              </div>
            </div>
          );
        };

        const LifeAdmin = () => {
          const [familyPIN, setFamilyPIN] = useState(null);
          const [activeTab, setActiveTab] = useState('recipes');
          
          const [recipes, setRecipes] = useState(() => {
            const saved = localStorage.getItem('recipes');
            if (saved) return JSON.parse(saved);
            localStorage.setItem('recipes', JSON.stringify(INITIAL_RECIPES));
            return INITIAL_RECIPES;
          });

          const [searchQuery, setSearchQuery] = useState('');
          const [recipeFilter, setRecipeFilter] = useState({ mealPrep: 'all', genre: 'all' });
          const [selectedRecipe, setSelectedRecipe] = useState(null);
          const [showAddRecipe, setShowAddRecipe] = useState(false);
          const [editingRecipe, setEditingRecipe] = useState(null);

          useEffect(() => {
            localStorage.setItem('recipes', JSON.stringify(recipes));
          }, [recipes]);

          useEffect(() => {
            const storedPIN = localStorage.getItem('familyPIN');
            if (storedPIN) setFamilyPIN(storedPIN);
          }, []);

          const handleLogout = () => {
            if (confirm('Logout?')) {
              localStorage.removeItem('familyPIN');
              setFamilyPIN(null);
            }
          };

          const addRecipe = (recipe) => {
            const newRecipe = { ...recipe, id: Date.now() };
            setRecipes([...recipes, newRecipe]);
            setShowAddRecipe(false);
          };

          const updateRecipe = (id, updatedRecipe) => {
            setRecipes(recipes.map(r => r.id === id ? { ...updatedRecipe, id } : r));
            setEditingRecipe(null);
          };

          const deleteRecipe = (id) => {
            if (confirm('Delete this recipe?')) {
              setRecipes(recipes.filter(r => r.id !== id));
            }
          };

          const filteredRecipes = recipes.filter(r => {
            if (recipeFilter.mealPrep !== 'all' && r.mealPrep.toString() !== recipeFilter.mealPrep) return false;
            if (recipeFilter.genre !== 'all' && r.genre !== recipeFilter.genre) return false;
            if (searchQuery && !r.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
            return true;
          });

          if (!familyPIN) return <Login onLogin={setFamilyPIN} />;

          return (
            <div className="flex flex-col h-screen bg-gray-50">
              <div className="gradient-bg text-white p-4 shadow-lg">
                <div className="flex justify-between items-center">
                  <div>
                    <h1 className="text-2xl font-bold">Life Admin</h1>
                    <p className="text-sm opacity-90">✓ {recipes.length} recipes saved</p>
                  </div>
                  <button onClick={handleLogout} className="p-2 hover:bg-white/20 rounded-lg"><LogOut size={20} /></button>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto p-4">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-2xl font-bold">Recipes ({filteredRecipes.length})</h2>
                  <button onClick={() => setShowAddRecipe(true)} className="gradient-bg text-white px-4 py-2 rounded-lg flex items-center gap-2">
                    <Plus size={20} />
                    Add Recipe
                  </button>
                </div>

                <input type="text" placeholder="Search recipes..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full p-2 border rounded-lg mb-3" />

                <div className="grid grid-cols-2 gap-2 mb-4">
                  <select value={recipeFilter.mealPrep} onChange={(e) => setRecipeFilter({...recipeFilter, mealPrep: e.target.value})} className="p-2 border rounded-lg text-sm">
                    <option value="all">All</option>
                    <option value="true">Meal Prep</option>
                    <option value="false">Fresh</option>
                  </select>
                  <select value={recipeFilter.genre} onChange={(e) => setRecipeFilter({...recipeFilter, genre: e.target.value})} className="p-2 border rounded-lg text-sm">
                    <option value="all">All Cuisines</option>
                    <option value="Mexican">Mexican</option>
                    <option value="Italian">Italian</option>
                    <option value="Indian">Indian</option>
                    <option value="American">American</option>
                  </select>
                </div>

                <div className="space-y-3">
                  {filteredRecipes.map(recipe => (
                    <div key={recipe.id} className="bg-white p-4 rounded-lg shadow border">
                      <div className="flex justify-between items-start mb-2">
                        <h3 className="font-bold text-lg cursor-pointer" onClick={() => setSelectedRecipe(recipe)}>{recipe.name}</h3>
                        <div className="flex gap-2">
                          <button onClick={() => setEditingRecipe(recipe)} className="text-blue-600 p-1"><Edit size={18} /></button>
                          <button onClick={() => deleteRecipe(recipe.id)} className="text-red-600 p-1"><Trash2 size={18} /></button>
                        </div>
                      </div>
                      <p className="text-sm text-gray-600">{recipe.genre} • {recipe.mealType} • Serves {recipe.servings}</p>
                      {recipe.macros?.calories && <p className="text-xs text-gray-500 mt-1">🔥 {recipe.macros.calories} cal • 💪 {recipe.macros.protein}g protein</p>}
                    </div>
                  ))}
                </div>

                {showAddRecipe && <RecipeForm onSave={addRecipe} onCancel={() => setShowAddRecipe(false)} />}
                {editingRecipe && <RecipeForm recipe={editingRecipe} onSave={(updated) => updateRecipe(editingRecipe.id, updated)} onCancel={() => setEditingRecipe(null)} />}

                {selectedRecipe && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={() => setSelectedRecipe(null)}>
                    <div className="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6" onClick={(e) => e.stopPropagation()}>
                      <div className="flex justify-between items-start mb-4">
                        <h2 className="text-2xl font-bold">{selectedRecipe.name}</h2>
                        <button onClick={() => setSelectedRecipe(null)} className="text-gray-500"><X size={24} /></button>
                      </div>
                      <div className="space-y-4">
                        <div>
                          <p className="text-sm font-semibold text-gray-600">
                            {selectedRecipe.genre} • {selectedRecipe.mealType}<br/>
                            Serves {selectedRecipe.servings} • {selectedRecipe.cookingMethod} • {selectedRecipe.storage}
                          </p>
                        </div>
                        {selectedRecipe.macros?.calories && (
                          <div className="flex gap-4 text-sm">
                            <span>🔥 {selectedRecipe.macros.calories} cal</span>
                            <span>💪 {selectedRecipe.macros.protein}g protein</span>
                            <span>🍞 {selectedRecipe.macros.carbs}g carbs</span>
                            <span>🥑 {selectedRecipe.macros.fat}g fat</span>
                          </div>
                        )}
                        {selectedRecipe.ingredients && selectedRecipe.ingredients.length > 0 && (
                          <div>
                            <h3 className="font-bold mb-2">Ingredients</h3>
                            <ul className="text-sm space-y-1">
                              {selectedRecipe.ingredients.map((ing, i) => <li key={i}>• {ing}</li>)}
                            </ul>
                          </div>
                        )}
                        {selectedRecipe.instructions && (
                          <div>
                            <h3 className="font-bold mb-2">Instructions</h3>
                            <p className="text-sm text-gray-700">{selectedRecipe.instructions}</p>
                          </div>
                        )}
                        {selectedRecipe.reheating && (
                          <div>
                            <h3 className="font-bold mb-2">Reheating</h3>
                            <p className="text-sm text-gray-700">{selectedRecipe.reheating}</p>
                          </div>
                        )}
                        {selectedRecipe.link && <a href={selectedRecipe.link} target="_blank" className="inline-block gradient-bg text-white px-4 py-2 rounded-lg text-sm">View Original Recipe</a>}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        };

        ReactDOM.render(<LifeAdmin />, document.getElementById('root'));
    </script>
</body>
</html>
