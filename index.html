          const [selectedKid, setSelectedKid] = useState('yahya');
          const messagesEndRef = useRef(null);

          const family = {
            members: [
              { name: 'Nizam', relation: 'me', age: 37 },
              { name: 'Rabika', relation: 'wife', age: 35 },
              { name: 'Yahya', relation: 'son', age: 5 },
              { name: 'Sofiya', relation: 'daughter', age: 3 }
            ]
          };

          useEffect(() => {
            const storedPIN = localStorage.getItem('familyPIN');
            if (storedPIN) setFamilyPIN(storedPIN);
          }, []);

          useEffect(() => {
            if (!familyPIN) return;
            const loadData = () => {
              const key = `lifeAdmin_${familyPIN}`;
              const savedData = localStorage.getItem(key);
              if (savedData) {
                const data = JSON.parse(savedData);
                setEvents(data.events || []);
                setTasks(data.tasks || []);
                setMessages(data.messages || []);
                setChores(data.chores || []);
                setTodayChecklist(data.todayChecklist || []);
              }
            };
            loadData();
            const syncInterval = setInterval(loadData, 2000);
            return () => clearInterval(syncInterval);
          }, [familyPIN]);

          useEffect(() => {
            // Initialize today's checklist if empty
            const today = new Date().getDay();
            if (todayChecklist.length === 0 && (today === 0 || today === 6)) {
              const weekendItems = WEEKEND_CHECKLIST[today] || [];
              setTodayChecklist(weekendItems.map((item, i) => ({ ...item, id: i, completed: false })));
            }
          }, []);

          const saveToCloud = (newEvents, newTasks, newMessages, newChores, newChecklist) => {
            if (!familyPIN) return;
            const key = `lifeAdmin_${familyPIN}`;
            const data = {
              events: newEvents,
              tasks: newTasks,
              messages: newMessages,
              chores: newChores || chores,
              todayChecklist: newChecklist !== undefined ? newChecklist : todayChecklist,
              lastUpdated: new Date().toISOString()
            };
            localStorage.setItem(key, JSON.stringify(data));
            setSyncStatus('synced');
          };

          const generateWeeklyChores = () => {
            const today = new Date();
            const weekNumber = Math.floor((today.getTime() / (1000 * 60 * 60 * 24 * 7)));
            const newChores = [];
            
            CHORE_LIBRARY.forEach(choreTemplate => {
              if (choreTemplate.frequency === 'daily') {
                for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
                  const choreDate = new Date(today);
                  choreDate.setDate(today.getDate() - today.getDay() + dayOffset);
                  let assignee = choreTemplate.assignees[0];
                  if (choreTemplate.assignees.length > 1) {
                    assignee = choreTemplate.assignees[(weekNumber + dayOffset) % choreTemplate.assignees.length];
                  }
                  if (choreTemplate.times === 2) {
                    newChores.push({
                      id: `${choreTemplate.id}-${dayOffset}-morning`,
                      name: `${choreTemplate.name} (Morning)`,
                      date: choreDate.toISOString().split('T')[0],
                      assignee: assignee,
                      completed: false,
                      time: 'morning'
                    });
                    newChores.push({
                      id: `${choreTemplate.id}-${dayOffset}-evening`,
                      name: `${choreTemplate.name} (Evening)`,
                      date: choreDate.toISOString().split('T')[0],
                      assignee: assignee,
                      completed: false,
                      time: 'evening'
                    });
                  } else {
                    newChores.push({
                      id: `${choreTemplate.id}-${dayOffset}`,
                      name: choreTemplate.name,
                      date: choreDate.toISOString().split('T')[0],
                      assignee: choreTemplate.assignees.length === 1 ? choreTemplate.assignees[0] : assignee,
                      completed: false,
                      time: choreTemplate.time
                    });
                  }
                }
              } else if (choreTemplate.frequency === 'weekly') {
                const choreDate = new Date(today);
                choreDate.setDate(today.getDate() - today.getDay() + choreTemplate.day);
                let assignee = choreTemplate.assignees[0];
                if (choreTemplate.assignees.length > 1) {
                  assignee = choreTemplate.assignees[weekNumber % choreTemplate.assignees.length];
                }
                newChores.push({
                  id: `${choreTemplate.id}-week-${weekNumber}`,
                  name: choreTemplate.name,
                  date: choreDate.toISOString().split('T')[0],
                  assignee: assignee,
                  completed: false
                });
              } else if (choreTemplate.frequency === 'every-other-day') {
                for (let dayOffset = 0; dayOffset < 7; dayOffset += 2) {
                  const choreDate = new Date(today);
                  choreDate.setDate(today.getDate() - today.getDay() + dayOffset);
                  newChores.push({
                    id: `${choreTemplate.id}-${dayOffset}`,
                    name: choreTemplate.name,
                    date: choreDate.toISOString().split('T')[0],
                    assignee: choreTemplate.assignees[0],
                    completed: false
                  });
                }
              }
            });
            setChores(newChores);
            saveToCloud(events, tasks, messages, newChores, todayChecklist);
          };

          const toggleChecklistItem = (itemId) => {
            const updated = todayChecklist.map(item => 
              item.id === itemId ? { ...item, completed: !item.completed } : item
            );
            setTodayChecklist(updated);
            saveToCloud(events, tasks, messages, chores, updated);
          };

          const toggleChoreComplete = (choreId) => {
            const updatedChores = chores.map(chore => 
              chore.id === choreId ? { ...chore, completed: !chore.completed } : chore
            );
            setChores(updatedChores);
            saveToCloud(events, tasks, messages, updatedChores, todayChecklist);
          };

          const toggleTaskComplete = (taskId) => {
            const updatedTasks = tasks.map(task => 
              task.id === taskId ? { ...task, completed: !task.completed } : task
            );
            setTasks(updatedTasks);
            saveToCloud(events, updatedTasks, messages, chores, todayChecklist);
          };

          const deleteEvent = (eventId) => {
            const updatedEvents = events.filter(event => event.id !== eventId);
            setEvents(updatedEvents);
            saveToCloud(updatedEvents, tasks, messages, chores, todayChecklist);
          };

          const deleteTask = (taskId) => {
            const updatedTasks = tasks.filter(task => task.id !== taskId);
            setTasks(updatedTasks);
            saveToCloud(events, updatedTasks, messages, chores, todayChecklist);
          };

          const handleLogout = () => {
            if (confirm('Logout?')) {
              localStorage.removeItem('familyPIN');
              setFamilyPIN(null);
            }
          };

          const getPlatformColor = (platform) => {
            if (platform.includes('Apple TV')) return 'bg-black text-white';
            if (platform.includes('Netflix')) return 'bg-red-600 text-white';
            if (platform.includes('Disney')) return 'bg-blue-600 text-white';
            if (platform.includes('PBS')) return 'bg-blue-500 text-white';
            if (platform.includes('Amazon') || platform.includes('Prime')) return 'bg-orange-500 text-white';
            return 'bg-gray-600 text-white';
          };

          const getTypeColor = (type) => {
            const colors = {
              transit: 'bg-gray-100 text-gray-700',
              activity: 'bg-green-100 text-green-700',
              meal: 'bg-orange-100 text-orange-700',
              chore: 'bg-yellow-100 text-yellow-700',
              screen: 'bg-purple-100 text-purple-700',
              routine: 'bg-blue-100 text-blue-700',
              sleep: 'bg-indigo-100 text-indigo-700',
              prayer: 'bg-teal-100 text-teal-700',
              play: 'bg-pink-100 text-pink-700'
            };
            return colors[type] || 'bg-gray-100 text-gray-700';
          };

          const getPersonColor = (person) => {
            const colors = {
              'Nizam': 'bg-blue-100 text-blue-800',
              'Rabika': 'bg-purple-100 text-purple-800',
              'Yahya': 'bg-green-100 text-green-800',
              'Sofiya': 'bg-pink-100 text-pink-800',
            };
            return colors[person] || 'bg-gray-100 text-gray-800';
          };

          if (!familyPIN) return <Login onLogin={setFamilyPIN} />;

          const today = new Date().getDay();
          const isWeekend = today === 0 || today === 6;
          const todaySchedule = DAILY_SCHEDULES[today] || [];

          const groupedChores = {};
          chores.forEach(chore => {
            if (!groupedChores[chore.date]) groupedChores[chore.date] = [];
            groupedChores[chore.date].push(chore);
          });

          return (
            <div className="flex flex-col h-screen bg-gray-50">
              <div className="gradient-bg text-white p-4 shadow-lg">
                <div className="flex justify-between items-center">
                  <div>
                    <h1 className="text-2xl font-bold">Life Admin</h1>
                    <p className="text-sm opacity-90">✓ Synced</p>
                  </div>
                  <button onClick={handleLogout} className="p-2 hover:bg-white/20 rounded-lg"><LogOut size={20} /></button>
                </div>
              </div>

              <div className="flex bg-white border-b overflow-x-auto">
                <button onClick={() => setActiveTab('today')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'today' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <Home size={18} />
                  <span>Today</span>
                </button>
                <button onClick={() => setActiveTab('kids')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'kids' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <Tv size={18} />
                  <span>Shows</span>
                </button>
                <button onClick={() => setActiveTab('chores')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'chores' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <Trash2 size={18} />
                  <span>Chores</span>
                </button>
                <button onClick={() => setActiveTab('tasks')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'tasks' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <CheckSquare size={18} />
                  <span>Tasks</span>
                </button>
              </div>

              <div className="flex-1 overflow-y-auto">
                {activeTab === 'today' && (
                  <div className="p-4">
                    <h2 className="text-2xl font-bold mb-4">{['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][today]}</h2>
                    
                    {isWeekend ? (
                      <div className="space-y-2">
                        <p className="text-sm text-gray-600 mb-4">Check off activities as you complete them today!</p>
                        {todayChecklist.map(item => (
                          <div key={item.id} className="bg-white p-4 rounded-lg shadow border flex items-start gap-3">
                            <input type="checkbox" checked={item.completed} onChange={() => toggleChecklistItem(item.id)} className="mt-1 w-5 h-5" />
                            <div className="flex-1">
                              <p className={`font-medium ${item.completed ? 'line-through text-gray-400' : ''}`}>{item.activity}</p>
                              <span className={`text-xs px-2 py-1 rounded-full ${getTypeColor(item.type)}`}>{item.type}</span>
                              {item.assignee && <span className={`text-xs px-2 py-1 rounded-full ml-2 ${getPersonColor(item.assignee)}`}>{item.assignee}</span>}
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="space-y-2">
                        {todaySchedule.map((item, i) => (
                          <div key={i} className="bg-white p-3 rounded-lg shadow border">
                            <div className="flex items-start gap-3">
                              <div className="text-xs font-semibold text-gray-500 w-24 flex-shrink-0">{item.time}</div>
                              <div className="flex-1">
                                <p className="font-medium text-gray-800">{item.activity}</p>
                                <div className="flex gap-2 mt-1 flex-wrap">
                                  <span className={`text-xs px-2 py-1 rounded-full ${getTypeColor(item.type)}`}>{item.type}</span>
                                  {item.assignee && <span className={`text-xs px-2 py-1 rounded-full ${getPersonColor(item.assignee)}`}>{item.assignee}</span>}
                                  {item.suggests && item.type === 'screen' && (
                                    <span className="text-xs text-purple-600">→ Pick from Shows tab</span>
                                  )}
                                  {item.suggests && item.type === 'play' && (
                                    <span className="text-xs text-pink-600">→ Legos, puzzles, cars</span>
                                  )}
                                  {item.suggests && item.type === 'activity' && (
                                    <span className="text-xs text-green-600">→ Building, crafts, painting</span>
                                  )}
                                </div>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'kids' && (
                  <div className="p-4">
                    <div className="flex gap-2 mb-4">
                      <button onClick={() => setSelectedKid('yahya')} className={`flex-1 py-2 rounded-lg font-medium ${selectedKid === 'yahya' ? 'gradient-bg text-white' : 'bg-gray-200'}`}>Yahya</button>
                      <button onClick={() => setSelectedKid('sofiya')} className={`flex-1 py-2 rounded-lg font-medium ${selectedKid === 'sofiya' ? 'gradient-bg text-white' : 'bg-gray-200'}`}>Sofiya</button>
                      <button onClick={() => setSelectedKid('movies')} className={`flex-1 py-2 rounded-lg font-medium ${selectedKid === 'movies' ? 'gradient-bg text-white' : 'bg-gray-200'}`}>Movies</button>
                    </div>
                    <div className="space-y-2">
                      {selectedKid === 'movies' ? (
                        KIDS_CONTENT.movies.map((item, i) => (
                          <div key={i} className="bg-white p-3 rounded-lg shadow border flex justify-between items-center">
                            <span className="font-medium">{item.name}</span>
                            <span className={`text-xs px-2 py-1 rounded ${getPlatformColor(item.platform)}`}>{item.platform}</span>
                          </div>
                        ))
                      ) : (
                        KIDS_CONTENT[selectedKid].shows.map((item, i) => (
                          <div key={i} className="bg-white p-3 rounded-lg shadow border flex justify-between items-center">
                            <span className="font-medium">{item.name}</span>
                            <span className={`text-xs px-2 py-1 rounded ${getPlatformColor(item.platform)}`}>{item.platform}</span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}

                {activeTab === 'chores' && (
                  <div className="p-4 space-y-4">
                    {chores.length === 0 ? (
                      <div className="text-center py-12">
                        <button onClick={generateWeeklyChores} className="gradient-bg text-white px-6 py-3 rounded-lg inline-flex items-center gap-2">
                          <RefreshCw size={20} />
                          Generate Week
                        </button>
                      </div>
                    ) : (
                      <>
                        <button onClick={generateWeeklyChores} className="gradient-bg text-white px-4 py-2 rounded-lg text-sm inline-flex items-center gap-2">
                          <RefreshCw size={16} />
                          Regenerate
                        </button>
                        {Object.keys(groupedChores).sort().map(date => (
                          <div key={date} className="bg-white p-4 rounded-lg shadow border">
                            <h3 className="font-bold mb-3">{new Date(date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</h3>
                            <div className="space-y-2">
                              {groupedChores[date].map(chore => (
                                <div key={chore.id} className="flex items-start gap-3 p-3 bg-gray-50 rounded-lg">
                                  <input type="checkbox" checked={chore.completed} onChange={() => toggleChoreComplete(chore.id)} className="mt-1 w-5 h-5" />
                                  <div className="flex-1">
                                    <p className={`font-medium ${chore.completed ? 'line-through text-gray-400' : ''}`}>{chore.name}</p>
                                    <span className={`text-xs px-2 py-1 rounded-full ${getPersonColor(chore.assignee)}`}>{chore.assignee}</span>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}
                      </>
                    )}
                  </div>
                )}

                {activeTab === 'tasks' && (
                  <div className="p-4 space-y-3">
                    {tasks.length === 0 ? (
                      <div className="text-center py-12"><p>No tasks yet</p></div>
                    ) : (
                      tasks.map(task => (
                        <div key={task.id} className="bg-white p-4 rounded-lg shadow border flex items-start gap-3">
                          <input type="checkbox" checked={task.completed} onChange={() => toggleTaskComplete(task.id)} className="mt-1 w-5 h-5" />
                          <div className="flex-1">
                            <h3 className={`font-medium ${task.completed ? 'line-through text-gray-400' : ''}`}>{task.title}</h3>
                          </div>
                          <button onClick={() => deleteTask(task.id)} className="text-red-600 text-sm">Delete</button>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        };

        ReactDOM.render(<LifeAdmin />, document.getElementById('root'));
    </script>
</body>
</html>
