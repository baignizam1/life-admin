        const LifeAdmin = () => {
          const [familyPIN, setFamilyPIN] = useState(null);

          const [family] = useState({
            members: [
              { name: 'Nizam', relation: 'me', age: 37 },
              { name: 'Rabika', relation: 'wife', age: 35 },

            recurringSchedule: [
              {
                title: "Yahya - Jiu Jitsu",

                days: [1, 2, 4],
                startTime: "17:00",
                endTime: "18:00",
                category: "kids",
                person: "Yahya"
              },
              {
                title: "Yahya - Sunday School",
                location: "ISNS",
                days: [0],
                startTime: "09:30",
                endTime: "12:30",
                category: "kids",
                person: "Yahya"
              },
              {
                title: "Yahya - School",
                location: "Blooming Minds, Schaumburg",
                days: [1, 2, 3, 4, 5],
                startTime: "08:00",
                endTime: "16:30",
                category: "kids",
                person: "Yahya"
              },
              {
                title: "Sofiya - School",
                location: "Blooming Minds, Schaumburg",
                days: [1, 2, 3, 4, 5],
                startTime: "08:00",
                endTime: "16:30",
                category: "kids",

          });

          useEffect(() => {
            const storedPIN = localStorage.getItem('familyPIN');
            if (storedPIN) {
              setFamilyPIN(storedPIN);
            }
          }, []);

          useEffect(() => {
            if (!familyPIN) return;

            const loadData = () => {
              const key = `lifeAdmin_${familyPIN}`;
              const savedData = localStorage.getItem(key);
              
              if (savedData) {
                const data = JSON.parse(savedData);
                setEvents(data.events || []);
                setTasks(data.tasks || []);
                setMessages(data.messages || []);
                setChores(data.chores || []);
              }
            };

            loadData();

            const syncInterval = setInterval(() => {
              loadData();
            }, 2000);

            return () => clearInterval(syncInterval);
          }, [familyPIN]);

          const saveToCloud = (newEvents, newTasks, newMessages, newChores) => {
            if (!familyPIN) return;
            
            const key = `lifeAdmin_${familyPIN}`;
            const data = {
              events: newEvents,
              tasks: newTasks,
              messages: newMessages,
              chores: newChores || chores,
              lastUpdated: new Date().toISOString()
            };
            
            localStorage.setItem(key, JSON.stringify(data));
            setSyncStatus('synced');
          };

          const generateWeeklyChores = () => {
            const today = new Date();
            const weekNumber = Math.floor((today.getTime() / (1000 * 60 * 60 * 24 * 7)));
            const newChores = [];
            
            CHORE_LIBRARY.forEach(choreTemplate => {
              if (choreTemplate.frequency === 'daily') {
                for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
                  const choreDate = new Date(today);
                  choreDate.setDate(today.getDate() - today.getDay() + dayOffset);
                  
                  let assignee = choreTemplate.assignees[0];
                  if (choreTemplate.assignees.length > 1) {
                    assignee = choreTemplate.assignees[(weekNumber + dayOffset) % choreTemplate.assignees.length];
                  }
                  
                  if (choreTemplate.times === 2) {
                    newChores.push({
                      id: `${choreTemplate.id}-${dayOffset}-morning`,
                      name: `${choreTemplate.name} (Morning)`,
                      date: choreDate.toISOString().split('T')[0],
                      assignee: assignee,
                      completed: false,
                      time: 'morning'
                    });
                    newChores.push({
                      id: `${choreTemplate.id}-${dayOffset}-evening`,
                      name: `${choreTemplate.name} (Evening)`,
                      date: choreDate.toISOString().split('T')[0],
                      assignee: assignee,
                      completed: false,
                      time: 'evening'
                    });
                  } else {
                    newChores.push({
                      id: `${choreTemplate.id}-${dayOffset}`,
                      name: choreTemplate.name,
                      date: choreDate.toISOString().split('T')[0],
                      assignee: choreTemplate.assignees.length === 1 ? choreTemplate.assignees[0] : assignee,
                      completed: false,
                      time: choreTemplate.time
                    });
                  }
                }
              } else if (choreTemplate.frequency === 'weekly') {
                const choreDate = new Date(today);
                choreDate.setDate(today.getDate() - today.getDay() + choreTemplate.day);
                
                let assignee = choreTemplate.assignees[0];
                if (choreTemplate.assignees.length > 1) {
                  assignee = choreTemplate.assignees[weekNumber % choreTemplate.assignees.length];
                }
                
                newChores.push({
                  id: `${choreTemplate.id}-week-${weekNumber}`,
                  name: choreTemplate.name,
                  date: choreDate.toISOString().split('T')[0],
                  assignee: assignee,
                  completed: false
                });
              } else if (choreTemplate.frequency === 'every-other-day') {
                for (let dayOffset = 0; dayOffset < 7; dayOffset += 2) {
                  const choreDate = new Date(today);
                  choreDate.setDate(today.getDate() - today.getDay() + dayOffset);
                  
                  newChores.push({
                    id: `${choreTemplate.id}-${dayOffset}`,
                    name: choreTemplate.name,
                    date: choreDate.toISOString().split('T')[0],
                    assignee: choreTemplate.assignees[0],
                    completed: false
                  });
                }
              }
            });
            
            setChores(newChores);
            saveToCloud(events, tasks, messages, newChores);
          };

          useEffect(() => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          }, [messages]);

          const shareToCalendar = async (event) => {
            const formatDate = (date) => {
              return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            };

            const startDate = new Date(event.startTime);
            const endDate = new Date(event.endTime);

            const icsContent = [
              'BEGIN:VCALENDAR',
              'VERSION:2.0',
              'PRODID:-//Life Admin//EN',
              'CALSCALE:GREGORIAN',
              'METHOD:PUBLISH',
              'BEGIN:VEVENT',
              `UID:${event.id}@lifeadmin.app`,
              `DTSTAMP:${formatDate(new Date())}`,
              `DTSTART:${formatDate(startDate)}`,
              `DTEND:${formatDate(endDate)}`,
              `SUMMARY:${event.title}`,
              event.location ? `LOCATION:${event.location}` : '',
              event.description ? `DESCRIPTION:${event.description}` : '',
              'STATUS:CONFIRMED',
              'END:VEVENT',
              'END:VCALENDAR'
            ].filter(line => line).join('\r\n');

            if (navigator.share) {
              try {
                const file = new File([icsContent], `${event.title}.ics`, {
                  type: 'text/calendar',
                });
                
                await navigator.share({
                  files: [file],
                  title: event.title,
                  text: `Add ${event.title} to your calendar`
                });
              } catch (err) {
                if (err.name !== 'AbortError') {
                  downloadICS(event, icsContent);
                }
              }
            } else {
              downloadICS(event, icsContent);
            }
          };

          const downloadICS = (event, icsContent) => {
            const blob = new Blob([icsContent], { type: 'text/calendar' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `${event.title.replace(/\s+/g, '_')}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
          };

          const processUserMessage = async (userMessage) => {
            const newMessages = [...messages, { role: 'user', content: userMessage }];
            setMessages(newMessages);
            setIsLoading(true);
            setSyncStatus('syncing');

            try {
              const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  model: 'claude-sonnet-4-20250514',
                  max_tokens: 2000,
                  messages: [
                    ...newMessages,
                    {
                      role: 'user',
                      content: `You are a personal AI assistant managing a life admin app for the Nizam family.

FAMILY MEMBERS:
${family.members.map(m => `- ${m.name} (${m.relation}, ${m.age} years old)`).join('\n')}

The user said: "${userMessage}"

Analyze their message and respond with a JSON object (and ONLY a JSON object, no other text) in this format:
{
  "response": "Your friendly response to the user.",
  "actions": [
    {
      "type": "add_event" | "add_task" | "none",
      "data": {
        "title": "Event title",
        "startTime": "ISO datetime string",
        "endTime": "ISO datetime string",
        "location": "Location (optional)",
        "description": "Description (optional)",
        "category": "family" | "personal" | "kids" | "work",
        "attendees": ["family member names"]
      }
    }
  ]
}

Today is Monday, November 18, 2025.

CRITICAL: Your ENTIRE response must be ONLY valid JSON.`
                    }
                  ]
                })
              });

              const data = await response.json();
              let responseText = data.content[0].text;
              responseText = responseText.replace(/\`\`\`json\n?/g, '').replace(/\`\`\`\n?/g, '').trim();
              
              const claudeResponse = JSON.parse(responseText);

              let updatedEvents = [...events];
              let updatedTasks = [...tasks];

              if (claudeResponse.actions && claudeResponse.actions.length > 0) {
                claudeResponse.actions.forEach(action => {
                  if (action.type === 'add_event' && action.data) {
                    const newEvent = {
                      id: Date.now() + Math.random(),
                      ...action.data,
                      completed: false
                    };
                    updatedEvents.push(newEvent);
                  } else if (action.type === 'add_task' && action.data) {
                    const newTask = {
                      id: Date.now() + Math.random(),
                      ...action.data,
                      completed: false
                    };
                    updatedTasks.push(newTask);
                  }
                });
              }

              const updatedMessages = [...newMessages, { 
                role: 'assistant', 
                content: claudeResponse.response 
              }];

              setEvents(updatedEvents);
              setTasks(updatedTasks);
              setMessages(updatedMessages);
              
              saveToCloud(updatedEvents, updatedTasks, updatedMessages, chores);

            } catch (error) {
              console.error('Error:', error);
              const errorMessages = [...newMessages, { 
                role: 'assistant', 
                content: 'Sorry, I had trouble processing that.' 
              }];
              setMessages(errorMessages);
              saveToCloud(events, tasks, errorMessages, chores);
            } finally {
              setIsLoading(false);
            }
          };

          const handleSend = async () => {
            if (!input.trim() || isLoading) return;
            const userMessage = input;
            setInput('');
            await processUserMessage(userMessage);
          };

          const handleKeyPress = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              handleSend();
            }
          };

          const toggleTaskComplete = (taskId) => {
            const updatedTasks = tasks.map(task => 
              task.id === taskId ? { ...task, completed: !task.completed } : task
            );
            setTasks(updatedTasks);
            saveToCloud(events, updatedTasks, messages, chores);
          };

          const toggleChoreComplete = (choreId) => {
            const updatedChores = chores.map(chore => 
              chore.id === choreId ? { ...chore, completed: !chore.completed } : chore
            );
            setChores(updatedChores);
            saveToCloud(events, tasks, messages, updatedChores);
          };

          const deleteEvent = (eventId) => {
            const updatedEvents = events.filter(event => event.id !== eventId);
            setEvents(updatedEvents);
            saveToCloud(updatedEvents, tasks, messages, chores);
          };

          const deleteTask = (taskId) => {
            const updatedTasks = tasks.filter(task => task.id !== taskId);
            setTasks(updatedTasks);
            saveToCloud(events, updatedTasks, messages, chores);
          };

          const handleLogout = () => {
            if (confirm('Are you sure you want to log out?')) {
              localStorage.removeItem('familyPIN');
              setFamilyPIN(null);
            }
          };

          const formatDateTime = (dateString) => {
            const date = new Date(dateString);
            return date.toLocaleString('en-US', { 
              month: 'short', 
              day: 'numeric',
              hour: 'numeric',
              minute: '2-digit',
              hour12: true
            });
          };

          const formatDate = (dateString) => {
            const date = new Date(dateString);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const choreDate = new Date(date);
            choreDate.setHours(0, 0, 0, 0);
            
            if (choreDate.getTime() === today.getTime()) return 'Today';
            if (choreDate.getTime() === today.getTime() + 86400000) return 'Tomorrow';
            if (choreDate.getTime() === today.getTime() - 86400000) return 'Yesterday';
            
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
          };

          const getCategoryColor = (category) => {
            const colors = {
              family: 'bg-blue-100 text-blue-800',
              personal: 'bg-purple-100 text-purple-800',
              kids: 'bg-pink-100 text-pink-800',
              work: 'bg-gray-100 text-gray-800',
              chores: 'bg-orange-100 text-orange-800',
            };
            return colors[category] || colors.general;
          };

          const getPersonColor = (person) => {
            const colors = {
              'Nizam': 'bg-blue-100 text-blue-800',
              'Rabika': 'bg-purple-100 text-purple-800',
              'Yahya': 'bg-green-100 text-green-800',
              'Sofiya': 'bg-pink-100 text-pink-800',
            };
            return colors[person] || 'bg-gray-100 text-gray-800';
          };

          const getPlatformColor = (platform) => {
            if (platform.includes('Apple TV')) return 'bg-black text-white';
            if (platform.includes('Netflix')) return 'bg-red-600 text-white';
            if (platform.includes('Disney')) return 'bg-blue-600 text-white';
            if (platform.includes('PBS')) return 'bg-blue-500 text-white';
            if (platform.includes('Amazon') || platform.includes('Prime')) return 'bg-orange-500 text-white';
            return 'bg-gray-600 text-white';
          };

          if (!familyPIN) {
            return <Login onLogin={setFamilyPIN} />;
          }

          const groupedChores = {};
          chores.forEach(chore => {
            if (!groupedChores[chore.date]) {
              groupedChores[chore.date] = [];
            }
            groupedChores[chore.date].push(chore);
          });

          return (
            <div className="flex flex-col h-screen bg-gray-50">
              <div className="gradient-bg text-white p-4 shadow-lg">
                <div className="flex justify-between items-center">
                  <div>
                    <h1 className="text-2xl font-bold">Life Admin</h1>
                    <p className="text-sm opacity-90">
                      {syncStatus === 'syncing' ? '☁️ Syncing...' : '✓ Synced'}
                    </p>
                  </div>
                  <button
                    onClick={handleLogout}
                    className="p-2 hover:bg-white/20 rounded-lg transition-colors"
                  >
                    <LogOut size={20} />
                  </button>
                </div>
              </div>

              <div className="flex bg-white border-b overflow-x-auto">
                <button onClick={() => setActiveTab('chat')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center justify-center gap-1 text-xs ${activeTab === 'chat' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <MessageSquare size={18} />
                  <span>Chat</span>
                </button>
                <button onClick={() => setActiveTab('kids')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center justify-center gap-1 text-xs ${activeTab === 'kids' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <Tv size={18} />
                  <span>Kids</span>
                </button>
                <button onClick={() => setActiveTab('chores')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center justify-center gap-1 text-xs ${activeTab === 'chores' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <Trash2 size={18} />
                  <span>Chores</span>
                  {chores.filter(c => !c.completed).length > 0 && <span className="bg-blue-600 text-white text-xs rounded-full px-1.5">{chores.filter(c => !c.completed).length}</span>}
                </button>
                <button onClick={() => setActiveTab('calendar')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center justify-center gap-1 text-xs ${activeTab === 'calendar' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <Calendar size={18} />
                  <span>Events</span>
                  {events.length > 0 && <span className="bg-blue-600 text-white text-xs rounded-full px-1.5">{events.length}</span>}
                </button>
                <button onClick={() => setActiveTab('tasks')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center justify-center gap-1 text-xs ${activeTab === 'tasks' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <CheckSquare size={18} />
                  <span>Tasks</span>
                  {tasks.filter(t => !t.completed).length > 0 && <span className="bg-blue-600 text-white text-xs rounded-full px-1.5">{tasks.filter(t => !t.completed).length}</span>}
                </button>
              </div>

              <div className="flex-1 overflow-y-auto">
                {activeTab === 'chat' && (
                  <div className="flex flex-col h-full">
                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                      {messages.length === 0 && (
                        <div className="text-center py-12 text-gray-500">
                          <MessageSquare size={48} className="mx-auto mb-4 opacity-50" />
                          <p className="text-lg font-medium">Start a conversation!</p>
                        </div>
                      )}
                      
                      {messages.map((message, index) => (
                        <div key={index} className={`flex ${message.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                          <div className={`max-w-[80%] p-3 rounded-lg ${message.role === 'user' ? 'bg-gradient-to-r from-blue-600 to-purple-600 text-white' : 'bg-white border text-gray-800'}`}>
                            {message.content}
                          </div>
                        </div>
                      ))}
                      
                      {isLoading && (
                        <div className="flex justify-start">
                          <div className="bg-white border p-3 rounded-lg">
                            <div className="flex gap-1">
                              <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                              <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></div>
                              <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></div>
                            </div>
                          </div>
                        </div>
                      )}
                      <div ref={messagesEndRef} />
                    </div>

                    <div className="border-t bg-white p-4">
                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={input}
                          onChange={(e) => setInput(e.target.value)}
                          onKeyPress={handleKeyPress}
                          placeholder="Type your message..."
                          className="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                          disabled={isLoading}
                        />
                        <button
                          onClick={handleSend}
                          disabled={!input.trim() || isLoading}
                          className="gradient-bg text-white px-6 py-3 rounded-lg font-medium disabled:opacity-50"
                        >
                          Send
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'kids' && (
                  <div className="p-4">
                    <div className="flex gap-2 mb-4">
                      <button
                        onClick={() => setSelectedKid('yahya')}
                        className={`flex-1 py-2 px-4 rounded-lg font-medium ${selectedKid === 'yahya' ? 'gradient-bg text-white' : 'bg-gray-200 text-gray-700'}`}
                      >
                        Yahya (5)
                      </button>
                      <button
                        onClick={() => setSelectedKid('sofiya')}
                        className={`flex-1 py-2 px-4 rounded-lg font-medium ${selectedKid === 'sofiya' ? 'gradient-bg text-white' : 'bg-gray-200 text-gray-700'}`}
                      >
                        Sofiya (3)
                      </button>
                      <button
                        onClick={() => setSelectedKid('movies')}
                        className={`flex-1 py-2 px-4 rounded-lg font-medium ${selectedKid === 'movies' ? 'gradient-bg text-white' : 'bg-gray-200 text-gray-700'}`}
                      >
                        Movies
                      </button>
                    </div>

                    <div className="space-y-2">
                      {selectedKid === 'movies' ? (
                        KIDS_CONTENT.movies.map((item, index) => (
                          <div key={index} className="bg-white p-3 rounded-lg shadow border flex justify-between items-center">
                            <span className="font-medium text-gray-800">{item.name}</span>
                            <span className={`text-xs px-2 py-1 rounded ${getPlatformColor(item.platform)}`}>
                              {item.platform}
                            </span>
                          </div>
                        ))
                      ) : (
                        KIDS_CONTENT[selectedKid].shows.map((item, index) => (
                          <div key={index} className="bg-white p-3 rounded-lg shadow border flex justify-between items-center">
                            <span className="font-medium text-gray-800">{item.name}</span>
                            <span className={`text-xs px-2 py-1 rounded ${getPlatformColor(item.platform)}`}>
                              {item.platform}
                            </span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}

                {activeTab === 'chores' && (
                  <div className="p-4 space-y-4">
                    {chores.length === 0 ? (
                      <div className="text-center py-12">
                        <Trash2 size={48} className="mx-auto mb-4 opacity-50 text-gray-500" />
                        <p className="text-lg font-medium text-gray-700 mb-4">No chores yet</p>
                        <button
                          onClick={generateWeeklyChores}
                          className="gradient-bg text-white px-6 py-3 rounded-lg font-medium inline-flex items-center gap-2"
                        >
                          <RefreshCw size={20} />
                          Generate This Week
                        </button>
                      </div>
                    ) : (
                      <>
                        <div className="flex justify-between items-center">
                          <h2 className="text-xl font-bold">Weekly Chores</h2>
                          <button
                            onClick={generateWeeklyChores}
                            className="gradient-bg text-white px-4 py-2 rounded-lg text-sm inline-flex items-center gap-2"
                          >
                            <RefreshCw size={16} />
                            Regenerate
                          </button>
                        </div>

                        {Object.keys(groupedChores).sort().map(date => (
                          <div key={date} className="bg-white p-4 rounded-lg shadow border">
                            <h3 className="font-bold mb-3">{formatDate(date)}</h3>
                            <div className="space-y-2">
                              {groupedChores[date].map(chore => (
                                <div key={chore.id} className="flex items-start gap-3 p-3 bg-gray-50 rounded-lg">
                                  <input
                                    type="checkbox"
                                    checked={chore.completed}
                                    onChange={() => toggleChoreComplete(chore.id)}
                                    className="mt-1 w-5 h-5"
                                  />
                                  <div className="flex-1">
                                    <p className={`font-medium ${chore.completed ? 'line-through text-gray-400' : ''}`}>
                                      {chore.name}
                                    </p>
                                    <span className={`text-xs px-2 py-1 rounded-full ${getPersonColor(chore.assignee)}`}>
                                      {chore.assignee}
                                    </span>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}
                      </>
                    )}
                  </div>
                )}

                {activeTab === 'calendar' && (
                  <div className="p-4 space-y-3">
                    {events.length === 0 ? (
                      <div className="text-center py-12">
                        <Calendar size={48} className="mx-auto mb-4 opacity-50" />
                        <p>No events yet</p>
                      </div>
                    ) : (
                      events.map(event => (
                        <div key={event.id} className="bg-white p-4 rounded-lg shadow border">
                          <h3 className="font-semibold">{event.title}</h3>
                          {event.location && <p className="text-sm text-gray-600">📍 {event.location}</p>}
                          <div className="flex gap-2 mt-3">
                            <button
                              onClick={() => shareToCalendar(event)}
                              className="flex-1 gradient-bg text-white py-2 rounded-lg text-sm"
                            >
                              Share
                            </button>
                            <button
                              onClick={() => deleteEvent(event.id)}
                              className="bg-red-100 text-red-600 py-2 px-4 rounded-lg text-sm"
                            >
                              Delete
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                )}

                {activeTab === 'tasks' && (
                  <div className="p-4 space-y-3">
                    {tasks.length === 0 ? (
                      <div className="text-center py-12">
                        <CheckSquare size={48} className="mx-auto mb-4 opacity-50" />
                        <p>No tasks yet</p>
                      </div>
                    ) : (
                      tasks.map(task => (
                        <div key={task.id} className="bg-white p-4 rounded-lg shadow border flex items-start gap-3">
                          <input
                            type="checkbox"
                            checked={task.completed}
                            onChange={() => toggleTaskComplete(task.id)}
                            className="mt-1 w-5 h-5"
                          />
                          <div className="flex-1">
                            <h3 className={`font-medium ${task.completed ? 'line-through text-gray-400' : ''}`}>
                              {task.title}
                            </h3>
                          </div>
                          <button
                            onClick={() => deleteTask(task.id)}
                            className="text-red-600 text-sm"
                          >
                            Delete
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        };

        ReactDOM.render(<LifeAdmin />, document.getElementById('root'));
    </script>
</body>
</html>
