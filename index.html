            loadData();
            const syncInterval = setInterval(loadData, 2000);
            return () => clearInterval(syncInterval);
          }, [familyPIN]);

          useEffect(() => {
            const today = new Date().getDay();
            if (todayChecklist.length === 0 && (today === 0 || today === 6)) {
              const weekendItems = WEEKEND_CHECKLIST[today] || [];
              setTodayChecklist(weekendItems.map((item, i) => ({ ...item, id: i, completed: false })));
            }
          }, []);

          useEffect(() => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          }, [messages]);

          const saveToCloud = (newEvents, newTasks, newMessages, newChores, newChecklist) => {
            if (!familyPIN) return;
            const key = `lifeAdmin_${familyPIN}`;
            const data = {
              events: newEvents,
              tasks: newTasks,
              messages: newMessages,
              chores: newChores || chores,
              todayChecklist: newChecklist !== undefined ? newChecklist : todayChecklist,
              lastUpdated: new Date().toISOString()
            };
            localStorage.setItem(key, JSON.stringify(data));
            setSyncStatus('synced');
          };

          const processUserMessage = async (userMessage) => {
            const newMessages = [...messages, { role: 'user', content: userMessage }];
            setMessages(newMessages);
            setIsLoading(true);
            setSyncStatus('syncing');

            try {
              const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  model: 'claude-sonnet-4-20250514',
                  max_tokens: 2000,
                  messages: [
                    ...newMessages,
                    {
                      role: 'user',
                      content: `You are managing a life admin app for the Nizam family.

FAMILY: Nizam (37), Rabika (35), Yahya (5), Sofiya (3)

The user said: "${userMessage}"

Respond with ONLY a JSON object:
{
  "response": "Your friendly response",
  "actions": [
    {
      "type": "add_event" | "add_task" | "none",
      "data": {
        "title": "Event title",
        "startTime": "2025-11-20T15:00:00",
        "endTime": "2025-11-20T16:00:00",
        "location": "Location",
        "description": "Details",
        "category": "family" | "personal" | "kids" | "work",
        "attendees": ["Nizam", "Yahya"]
      }
    }
  ]
}

Today is ${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.`
                    }
                  ]
                })
              });

              const data = await response.json();
              let responseText = data.content[0].text.replace(/\`\`\`json\n?/g, '').replace(/\`\`\`\n?/g, '').trim();
              const claudeResponse = JSON.parse(responseText);

              let updatedEvents = [...events];
              let updatedTasks = [...tasks];

              if (claudeResponse.actions) {
                claudeResponse.actions.forEach(action => {
                  if (action.type === 'add_event' && action.data) {
                    updatedEvents.push({ id: Date.now() + Math.random(), ...action.data, completed: false });
                  } else if (action.type === 'add_task' && action.data) {
                    updatedTasks.push({ id: Date.now() + Math.random(), ...action.data, completed: false });
                  }
                });
              }

              const updatedMessages = [...newMessages, { role: 'assistant', content: claudeResponse.response }];
              setEvents(updatedEvents);
              setTasks(updatedTasks);
              setMessages(updatedMessages);
              saveToCloud(updatedEvents, updatedTasks, updatedMessages, chores, todayChecklist);
            } catch (error) {
              console.error('Error:', error);
              const errorMessages = [...newMessages, { role: 'assistant', content: 'Sorry, I had trouble processing that.' }];
              setMessages(errorMessages);
              saveToCloud(events, tasks, errorMessages, chores, todayChecklist);
            } finally {
              setIsLoading(false);
            }
          };

          const handleSend = async () => {
            if (!input.trim() || isLoading) return;
            const userMessage = input;
            setInput('');
            await processUserMessage(userMessage);
          };

          const shareToCalendar = async (event) => {
            const formatDate = (date) => date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            const startDate = new Date(event.startTime);
            const endDate = new Date(event.endTime);
            const icsContent = [
              'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Life Admin//EN', 'BEGIN:VEVENT',
              `UID:${event.id}@lifeadmin.app`, `DTSTAMP:${formatDate(new Date())}`,
              `DTSTART:${formatDate(startDate)}`, `DTEND:${formatDate(endDate)}`,
              `SUMMARY:${event.title}`, event.location ? `LOCATION:${event.location}` : '',
              event.description ? `DESCRIPTION:${event.description}` : '',
              'END:VEVENT', 'END:VCALENDAR'
            ].filter(line => line).join('\r\n');

            if (navigator.share) {
              try {
                const file = new File([icsContent], `${event.title}.ics`, { type: 'text/calendar' });
                await navigator.share({ files: [file], title: event.title });
              } catch (err) {
                if (err.name !== 'AbortError') {
                  const blob = new Blob([icsContent], { type: 'text/calendar' });
                  const url = window.URL.createObjectURL(blob);
                  const link = document.createElement('a');
                  link.href = url;
                  link.download = `${event.title.replace(/\s+/g, '_')}.ics`;
                  document.body.appendChild(link);
                  link.click();
                  document.body.removeChild(link);
                  window.URL.revokeObjectURL(url);
                }
              }
            }
          };

          const generateWeeklyChores = () => {
            const today = new Date();
            const weekNumber = Math.floor((today.getTime() / (1000 * 60 * 60 * 24 * 7)));
            const newChores = [];
            
            CHORE_LIBRARY.forEach(choreTemplate => {
              if (choreTemplate.frequency === 'daily') {
                for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
                  const choreDate = new Date(today);
                  choreDate.setDate(today.getDate() - today.getDay() + dayOffset);
                  let assignee = choreTemplate.assignees[(weekNumber + dayOffset) % choreTemplate.assignees.length] || choreTemplate.assignees[0];
                  if (choreTemplate.times === 2) {
                    newChores.push({ id: `${choreTemplate.id}-${dayOffset}-morning`, name: `${choreTemplate.name} (Morning)`, date: choreDate.toISOString().split('T')[0], assignee, completed: false });
                    newChores.push({ id: `${choreTemplate.id}-${dayOffset}-evening`, name: `${choreTemplate.name} (Evening)`, date: choreDate.toISOString().split('T')[0], assignee, completed: false });
                  } else {
                    newChores.push({ id: `${choreTemplate.id}-${dayOffset}`, name: choreTemplate.name, date: choreDate.toISOString().split('T')[0], assignee, completed: false });
                  }
                }
              } else if (choreTemplate.frequency === 'weekly') {
                const choreDate = new Date(today);
                choreDate.setDate(today.getDate() - today.getDay() + choreTemplate.day);
                const assignee = choreTemplate.assignees[weekNumber % choreTemplate.assignees.length] || choreTemplate.assignees[0];
                newChores.push({ id: `${choreTemplate.id}-week`, name: choreTemplate.name, date: choreDate.toISOString().split('T')[0], assignee, completed: false });
              } else if (choreTemplate.frequency === 'every-other-day') {
                for (let dayOffset = 0; dayOffset < 7; dayOffset += 2) {
                  const choreDate = new Date(today);
                  choreDate.setDate(today.getDate() - today.getDay() + dayOffset);
                  newChores.push({ id: `${choreTemplate.id}-${dayOffset}`, name: choreTemplate.name, date: choreDate.toISOString().split('T')[0], assignee: choreTemplate.assignees[0], completed: false });
                }
              }
            });
            setChores(newChores);
            saveToCloud(events, tasks, messages, newChores, todayChecklist);
          };

          const toggleChecklistItem = (itemId) => {

            setTasks(updatedTasks);

          };

          const deleteEvent = (eventId) => {

                <button onClick={() => setActiveTab('shows')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'shows' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>

                <button onClick={() => setActiveTab('chores')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'chores' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>

              <div className="flex-1 overflow-y-auto">
                {activeTab === 'today' && (

                    <div className="flex justify-between items-center mb-4">

                      {isLoading && (

                                  <input type="checkbox" checked={chore.completed} onChange={() => toggleChoreComplete(chore.id)} className="mt-1 w-5 h-5" />
                                  <div className="flex-1">
                                    <p className={chore.completed ? 'line-through text-gray-400' : ''}>{chore.name}</p>
                                    <span className={`text-xs px-2 py-1 rounded-full ${getPersonColor(chore.assignee)}`}>{chore.assignee}</span>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}
                      </>
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        };

        ReactDOM.render(<LifeAdmin />, document.getElementById('root'));
    </script>
</body>
</html>
