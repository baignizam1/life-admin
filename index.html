          const shareToCalendar = async (event) => {
            const formatDate = (date) => date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            const startDate = new Date(event.startTime);
            const endDate = new Date(event.endTime);
            const icsContent = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Life Admin//EN', 'BEGIN:VEVENT', `UID:${event.id}@lifeadmin.app`, `DTSTAMP:${formatDate(new Date())}`, `DTSTART:${formatDate(startDate)}`, `DTEND:${formatDate(endDate)}`, `SUMMARY:${event.title}`, event.location ? `LOCATION:${event.location}` : '', event.description ? `DESCRIPTION:${event.description}` : '', 'END:VEVENT', 'END:VCALENDAR'].filter(line => line).join('\r\n');
            if (navigator.share) {
              try {
                const file = new File([icsContent], `${event.title}.ics`, { type: 'text/calendar' });
                await navigator.share({ files: [file], title: event.title });
              } catch (err) {
                if (err.name !== 'AbortError') downloadICS(event, icsContent);
              }
            } else {
              downloadICS(event, icsContent);
            }
          };

          const downloadICS = (event, icsContent) => {
            const blob = new Blob([icsContent], { type: 'text/calendar' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `${event.title.replace(/\s+/g, '_')}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);

              Geography: 'bg-yellow-100 text-yellow-800',
              History: 'bg-orange-100 text-orange-800',
              Arts: 'bg-red-100 text-red-800',
              'Problem Solving': 'bg-indigo-100 text-indigo-800',
              Adventure: 'bg-teal-100 text-teal-800',
              'Life Skills': 'bg-gray-100 text-gray-800',
              'Special Interest': 'bg-cyan-100 text-cyan-800',
              family: 'bg-blue-100 text-blue-800', 
              personal: 'bg-purple-100 text-purple-800', 
              kids: 'bg-pink-100 text-pink-800', 
              work: 'bg-gray-100 text-gray-800' 
            };
            return colors[category] || 'bg-gray-100 text-gray-800';
          };

          const getPlatformColor = (platform) => {
            if (platform.includes('Apple TV')) return 'bg-black text-white';
            if (platform.includes('Netflix')) return 'bg-red-600 text-white';
            if (platform.includes('Disney')) return 'bg-blue-600 text-white';
            if (platform.includes('PBS')) return 'bg-blue-500 text-white';
            if (platform.includes('Amazon') || platform.includes('Prime')) return 'bg-orange-500 text-white';
            if (platform.includes('Paramount')) return 'bg-blue-700 text-white';
            if (platform.includes('HBO')) return 'bg-purple-600 text-white';
            if (platform.includes('YouTube')) return 'bg-red-500 text-white';
            if (platform.includes('Peacock')) return 'bg-yellow-500 text-white';
            return 'bg-gray-600 text-white';
          };

          const getTypeColor = (type) => {
            const colors = { transit: 'bg-gray-100 text-gray-700', activity: 'bg-green-100 text-green-700', meal: 'bg-orange-100 text-orange-700', chore: 'bg-yellow-100 text-yellow-700', screen: 'bg-purple-100 text-purple-700', routine: 'bg-blue-100 text-blue-700', sleep: 'bg-indigo-100 text-indigo-700', prayer: 'bg-teal-100 text-teal-700', play: 'bg-pink-100 text-pink-700' };
            return colors[type] || 'bg-gray-100 text-gray-700';
          };

          const getPersonColor = (person) => {
            const colors = { 'Nizam': 'bg-blue-100 text-blue-800', 'Rabika': 'bg-purple-100 text-purple-800', 'Yahya': 'bg-green-100 text-green-800', 'Sofiya': 'bg-pink-100 text-pink-800' };
            return colors[person] || 'bg-gray-100 text-gray-800';
          };

          if (!familyPIN) return <Login onLogin={setFamilyPIN} />;

          const today = new Date().getDay();
          const isWeekend = today === 0 || today === 6;
          const todaySchedule = DAILY_SCHEDULES[today] || [];
          
          const filteredSchedule = scheduleView === 'family' 
            ? todaySchedule 
            : todaySchedule.filter(item => item.people && item.people.includes(scheduleView));

          const filteredChecklist = scheduleView === 'family'
            ? todayChecklist
            : todayChecklist.filter(item => item.people && item.people.includes(scheduleView));

          const groupedChores = {};
          chores.forEach(chore => {
            if (!groupedChores[chore.date]) groupedChores[chore.date] = [];
            groupedChores[chore.date].push(chore);
          });

          // Filter shows
          let displayShows = showFilter === 'all' ? ALL_SHOWS : showFilter === 'yahya' ? ALL_SHOWS.filter(s => s.age.includes('5+') || s.age.includes('7+') || s.age.includes('8+')) : ALL_SHOWS.filter(s => s.age.includes('2+') || s.age.includes('3+'));
          
          if (categoryFilter !== 'All') {
            displayShows = displayShows.filter(s => s.category === categoryFilter);
          }

          if (platformFilter !== 'All') {
            displayShows = displayShows.filter(s => s.platform.includes(platformFilter));
          }

          if (searchQuery) {
            displayShows = displayShows.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase()) || s.teaches.toLowerCase().includes(searchQuery.toLowerCase()));
          }

          const categories = ['All', ...new Set(ALL_SHOWS.map(s => s.category))];
          const platforms = ['All', 'Netflix', 'Apple TV+', 'Disney+', 'PBS Kids', 'Paramount+', 'Prime', 'HBO Max', 'YouTube', 'Peacock'];

          return (
            <div className="flex flex-col h-screen bg-gray-50">
              <div className="gradient-bg text-white p-4 shadow-lg">
                <div className="flex justify-between items-center">
                  <div>
                    <h1 className="text-2xl font-bold">Life Admin</h1>
                    <p className="text-sm opacity-90">✓ Synced</p>
                  </div>
                  <button onClick={handleLogout} className="p-2 hover:bg-white/20 rounded-lg"><LogOut size={20} /></button>
                </div>
              </div>

              <div className="flex bg-white border-b overflow-x-auto">
                <button onClick={() => setActiveTab('today')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'today' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <Home size={18} />
                  <span>Today</span>
                </button>
                <button onClick={() => setActiveTab('calendar')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'calendar' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <Calendar size={18} />
                  <span>Events</span>
                  {events.length > 0 && <span className="bg-blue-600 text-white text-xs rounded-full px-1.5">{events.length}</span>}
                </button>
                <button onClick={() => setActiveTab('kids')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'kids' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <Tv size={18} />
                  <span>Shows</span>
                </button>
                <button onClick={() => setActiveTab('chores')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'chores' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <Trash2 size={18} />
                  <span>Chores</span>
                </button>
                <button onClick={() => setActiveTab('tasks')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'tasks' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <CheckSquare size={18} />
                  <span>Tasks</span>
                </button>
              </div>

              <div className="flex-1 overflow-y-auto">
                {activeTab === 'today' && (
                  <div className="p-4">
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="text-2xl font-bold">{['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][today]}</h2>
                      <select value={scheduleView} onChange={(e) => setScheduleView(e.target.value)} className="p-2 border rounded-lg text-sm">
                        <option value="family">Family</option>
                        <option value="Nizam">Nizam</option>
                        <option value="Rabika">Rabika</option>
                        <option value="Yahya">Yahya</option>
                        <option value="Sofiya">Sofiya</option>
                      </select>
                    </div>
                    
                    {isWeekend ? (
                      <div className="space-y-2">
                        <p className="text-sm text-gray-600 mb-4">Check off activities today!</p>
                        {filteredChecklist.map(item => (
                          <div key={item.id} className="bg-white p-4 rounded-lg shadow border flex items-start gap-3">
                            <input type="checkbox" checked={item.completed} onChange={() => toggleChecklistItem(item.id)} className="mt-1 w-5 h-5" />
                            <div className="flex-1">
                              <p className={`font-medium ${item.completed ? 'line-through text-gray-400' : ''}`}>{item.activity}</p>
                              <div className="flex gap-2 mt-1">
                                <span className={`text-xs px-2 py-1 rounded-full ${getTypeColor(item.type)}`}>{item.type}</span>
                                {item.people && scheduleView === 'family' && <span className="text-xs text-gray-600">{item.people.join(', ')}</span>}
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="space-y-2">
                        {filteredSchedule.map((item, i) => (
                          <div key={i} className="bg-white p-3 rounded-lg shadow border">
                            <div className="flex items-start gap-3">
                              <div className="text-xs font-semibold text-gray-500 w-24 flex-shrink-0">{item.time}</div>
                              <div className="flex-1">
                                <p className="font-medium text-gray-800">{item.activity}</p>
                                <div className="flex gap-2 mt-1 flex-wrap">
                                  <span className={`text-xs px-2 py-1 rounded-full ${getTypeColor(item.type)}`}>{item.type}</span>
                                  {item.people && scheduleView === 'family' && <span className="text-xs text-gray-600">{item.people.join(', ')}</span>}
                                  {item.suggests && item.type === 'screen' && <span className="text-xs text-purple-600">→ Pick from Shows</span>}
                                  {item.suggests && item.type === 'play' && <span className="text-xs text-pink-600">→ Legos, puzzles, cars</span>}
                                  {item.suggests && item.type === 'activity' && <span className="text-xs text-green-600">→ Building, crafts</span>}
                                </div>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'calendar' && (
                  <div className="p-4 space-y-3">
                    {events.length === 0 ? (
                      <div className="text-center py-12"><p>No events</p></div>
                    ) : (
                      events.sort((a, b) => new Date(a.startTime) - new Date(b.startTime)).map(event => (
                        <div key={event.id} className="bg-white p-4 rounded-lg shadow border">
                          <div className="flex justify-between items-start mb-2">
                            <div>
                              <h3 className="font-semibold text-lg">{event.title}</h3>
                              {event.location && <p className="text-sm text-gray-600 mt-1">📍 {event.location}</p>}
                            </div>
                            <span className={`text-xs px-2 py-1 rounded-full ${getCategoryColor(event.category)}`}>{event.category}</span>
                          </div>
                          <div className="flex items-center gap-2 text-sm text-gray-600 mb-2">
                            <Clock size={16} />
                            <span>{formatDateTime(event.startTime)}</span>
                          </div>
                          {event.description && <p className="text-sm text-gray-700 mb-2">{event.description}</p>}
                          {event.attendees && (
                            <div className="flex items-center gap-2 mb-3 text-sm text-gray-600">
                              <Users size={16} />
                              <span>{event.attendees.join(', ')}</span>
                            </div>
                          )}
                          <div className="flex gap-2">
                            <button onClick={() => shareToCalendar(event)} className="flex-1 gradient-bg text-white py-2 rounded-lg text-sm flex items-center justify-center gap-2">
                              <Share2 size={16} />
                              Share
                            </button>
                            <button onClick={() => deleteEvent(event.id)} className="bg-red-100 text-red-600 py-2 px-4 rounded-lg text-sm">Delete</button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                )}

                {activeTab === 'kids' && (
                  <div className="p-4">
                    <div className="mb-4 space-y-3">
                      <div className="flex gap-2">
                        <button onClick={() => setShowFilter('all')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${showFilter === 'all' ? 'gradient-bg text-white' : 'bg-gray-200'}`}>All Shows</button>
                        <button onClick={() => setShowFilter('yahya')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${showFilter === 'yahya' ? 'gradient-bg text-white' : 'bg-gray-200'}`}>Yahya</button>
                        <button onClick={() => setShowFilter('sofiya')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${showFilter === 'sofiya' ? 'gradient-bg text-white' : 'bg-gray-200'}`}>Sofiya</button>
                        <button onClick={() => setShowFilter('movies')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${showFilter === 'movies' ? 'gradient-bg text-white' : 'bg-gray-200'}`}>Movies</button>
                      </div>

                      {showFilter !== 'movies' && (
                        <>
                          <input 
                            type="text" 
                            placeholder="Search shows..." 
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full p-2 border rounded-lg text-sm"
                          />

                          <select 
                            value={platformFilter}
                            onChange={(e) => setPlatformFilter(e.target.value)}
                            className="w-full p-2 border rounded-lg text-sm"
                          >
                            {platforms.map(p => <option key={p} value={p}>{p === 'All' ? 'All Platforms' : p}</option>)}
                          </select>

                          <div className="flex gap-2 overflow-x-auto pb-2">
                            {categories.map(cat => (
                              <button 
                                key={cat}
                                onClick={() => setCategoryFilter(cat)}
                                className={`px-3 py-1 rounded-full text-xs whitespace-nowrap ${categoryFilter === cat ? 'gradient-bg text-white' : 'bg-gray-200'}`}
                              >
                                {cat}
                              </button>
                            ))}
                          </div>
                        </>
                      )}
                    </div>

                    <div className="space-y-2">
                      {showFilter === 'movies' ? (
                        MOVIES.map((item, i) => (
                          <div key={i} className="bg-white p-3 rounded-lg shadow border">
                            <div className="flex justify-between items-start mb-2">
                              <span className="font-medium text-gray-800">{item.name}</span>
                              <span className={`text-xs px-2 py-1 rounded ${getPlatformColor(item.platform)}`}>{item.platform}</span>
                            </div>
                            <div className="flex gap-2">
                              <span className={`text-xs px-2 py-1 rounded-full ${getCategoryColor(item.category)}`}>{item.category}</span>
                              <span className="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-700">{item.age}</span>
                            </div>
                          </div>
                        ))
                      ) : (
                        displayShows.map((show, i) => (
                          <div key={i} className="bg-white p-3 rounded-lg shadow border">
                            <div className="flex justify-between items-start mb-2">
                              <span className="font-medium text-gray-800">{show.name}</span>
                              <span className={`text-xs px-2 py-1 rounded ${getPlatformColor(show.platform)}`}>{show.platform}</span>
                            </div>
                            <p className="text-xs text-gray-600 mb-2">📚 {show.teaches}</p>
                            <div className="flex gap-2">
                              <span className={`text-xs px-2 py-1 rounded-full ${getCategoryColor(show.category)}`}>{show.category}</span>
                              <span className="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-700">{show.age}</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                    <div className="mt-4 text-center text-sm text-gray-500">
                      Showing {showFilter === 'movies' ? MOVIES.length : displayShows.length} {showFilter === 'movies' ? 'movies' : 'shows'}
                    </div>
                  </div>
                )}

                {activeTab === 'chores' && (
                  <div className="p-4 space-y-4">
                    {chores.length === 0 ? (
                      <div className="text-center py-12">
                        <button onClick={generateWeeklyChores} className="gradient-bg text-white px-6 py-3 rounded-lg inline-flex items-center gap-2">
                          <RefreshCw size={20} />
                          Generate Week
                        </button>
                      </div>
                    ) : (
                      <>
                        <button onClick={generateWeeklyChores} className="gradient-bg text-white px-4 py-2 rounded-lg text-sm inline-flex items-center gap-2">
                          <RefreshCw size={16} />
                          Regenerate
                        </button>
                        {Object.keys(groupedChores).sort().map(date => (
                          <div key={date} className="bg-white p-4 rounded-lg shadow border">
                            <h3 className="font-bold mb-3">{new Date(date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</h3>
                            <div className="space-y-2">
                              {groupedChores[date].map(chore => (
                                <div key={chore.id} className="flex items-start gap-3 p-3 bg-gray-50 rounded-lg">
                                  <input type="checkbox" checked={chore.completed} onChange={() => toggleChoreComplete(chore.id)} className="mt-1 w-5 h-5" />
                                  <div className="flex-1">
                                    <p className={`font-medium ${chore.completed ? 'line-through text-gray-400' : ''}`}>{chore.name}</p>
                                    <span className={`text-xs px-2 py-1 rounded-full ${getPersonColor(chore.assignee)}`}>{chore.assignee}</span>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}
                      </>
                    )}
                  </div>
                )}

                {activeTab === 'tasks' && (
                  <div className="p-4 space-y-3">
                    {tasks.length === 0 ? (
                      <div className="text-center py-12"><p>No tasks</p></div>
                    ) : (
                      tasks.map(task => (
                        <div key={task.id} className="bg-white p-4 rounded-lg shadow border flex items-start gap-3">
                          <input type="checkbox" checked={task.completed} onChange={() => toggleTaskComplete(task.id)} className="mt-1 w-5 h-5" />
                          <div className="flex-1">
                            <h3 className={`font-medium ${task.completed ? 'line-through text-gray-400' : ''}`}>{task.title}</h3>
                          </div>
                          <button onClick={() => deleteTask(task.id)} className="text-red-600 text-sm">Delete</button>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        };

        ReactDOM.render(<LifeAdmin />, document.getElementById('root'));
    </script>
</body>
</html>
