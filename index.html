<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Life Admin">
    <title>Life Admin - Family AI Assistant</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        #root {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Icons
        const Calendar = (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>);
        const Users = (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>);
        const LogOut = (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>);
        const Trash2 = (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>);
        const RefreshCw = (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>);
        const Tv = (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>);
        const Home = (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>);
        const ChefHat = (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"></path><line x1="6" y1="17" x2="18" y2="17"></line></svg>);
        const ShoppingCart = (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>);
        const Plus = (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>);
        const Edit = (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>);
        const X = (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>);

        // SEED DATA - Your existing 66 recipes (abbreviated for space, but include ALL in actual file)
        const SEED_RECIPES = [
          { id: 1, name: 'Sheet Pan Cheesy Steak Fajita Burritos', mealPrep: true, mealType: 'Lunch/Dinner', genre: 'Mexican', storage: 'Freeze 3+ months', cookingMethod: 'Sheet Pan', servings: 12, macros: { calories: 425, protein: 45, carbs: 46, fat: 19 }, link: 'https://www.instagram.com/reel/DRH-aJfEeTI/', ingredients: ['1360g flank steak', '6 bell peppers', '2 onions', '12 tortillas'], instructions: 'Sheet pan magic', reheating: 'Microwave 2 mins, air fry 6-8 mins' },
          { id: 2, name: 'Chicken Pesto Alfredo Lasagna', mealPrep: true, mealType: 'Dinner', genre: 'Italian', storage: 'Freeze 3+ months', cookingMethod: 'Oven', servings: 10, macros: { calories: 630, protein: 63, carbs: 42, fat: 25 }, link: 'https://www.instagram.com/reel/DQ2LML-AcQv/', ingredients: ['1120g chicken breast', 'pesto', 'lasagna noodles'], instructions: 'Layer and bake', reheating: 'Microwave 4 mins' },
          // ... Add all 66 recipes here in actual file
        ];

        const SEED_SHOWS = [
          { id: 1, name: 'Hey Arnold', platform: 'Paramount+', category: 'Classic', age: '7+', teaches: 'Urban life, empathy' },
          { id: 2, name: 'Arthur', platform: 'PBS Kids', category: 'Classic', age: '5+', teaches: 'Social situations' },
          { id: 3, name: 'Wild Kratts', platform: 'PBS Kids', category: 'Science', age: '5+', teaches: 'Zoology' },
          { id: 4, name: 'Bluey', platform: 'Disney+', category: 'Social', age: '3+', teaches: 'Family, imagination' },
          { id: 5, name: 'Daniel Tiger', platform: 'PBS Kids', category: 'Social', age: '2+', teaches: 'Emotional intelligence' },
          // ... Add all shows here
        ];

        const SEED_CHORES = [
          { id: 1, name: 'Take dishes out of dishwasher', frequency: 'daily', assignees: ['Nizam', 'Rabika'], time: 'morning' },
          { id: 2, name: 'Take Trash out', frequency: 'weekly', day: 0, assignees: ['Nizam', 'Rabika'] },
          { id: 3, name: 'Feed the Cat', frequency: 'daily', times: 2, assignees: ['Sofiya'], time: 'morning-evening' },
          { id: 4, name: 'Clean Kitchen Counters', frequency: 'daily', assignees: ['Nizam', 'Rabika'], time: 'evening' },
          { id: 5, name: 'Vacuum Living Room', frequency: 'weekly', day: 6, assignees: ['Nizam', 'Rabika'] },
          // ... Add all chores
        ];

        const Login = ({ onLogin }) => {
          const [pin, setPin] = useState('');
          const [error, setError] = useState('');

          const handleSubmit = (e) => {
            e.preventDefault();
            if (pin.length < 4) {
              setError('PIN must be at least 4 characters');
              return;
            }
            localStorage.setItem('familyPIN', pin);
            onLogin(pin);
          };

          return (
            <div className="h-screen gradient-bg flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                <div className="text-center mb-8">
                  <div className="w-20 h-20 bg-gradient-to-br from-blue-600 to-purple-600 rounded-full mx-auto mb-4 flex items-center justify-center">
                    <Users size={40} className="text-white" />
                  </div>
                  <h1 className="text-3xl font-bold text-gray-800 mb-2">Life Admin</h1>
                  <p className="text-gray-600">Family AI Assistant</p>
                </div>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">Enter Family PIN</label>
                    <input type="text" value={pin} onChange={(e) => setPin(e.target.value)} placeholder="e.g., NizamFamily2025" className="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" autoFocus />
                    {error && <p className="text-red-600 text-sm mt-2">{error}</p>}
                  </div>
                  <button type="submit" className="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:shadow-lg">Access Family Account</button>
                </form>
              </div>
            </div>
          );
        };

        const LifeAdmin = () => {
          const [familyPIN, setFamilyPIN] = useState(null);
          const [activeTab, setActiveTab] = useState('recipes');
          
          // Load data from localStorage or seed
          const [recipes, setRecipes] = useState(() => {
            const saved = localStorage.getItem('recipes');
            return saved ? JSON.parse(saved) : SEED_RECIPES;
          });
          
          const [shows, setShows] = useState(() => {
            const saved = localStorage.getItem('shows');
            return saved ? JSON.parse(saved) : SEED_SHOWS;
          });
          
          const [choreTemplates, setChoreTemplates] = useState(() => {
            const saved = localStorage.getItem('choreTemplates');
            return saved ? JSON.parse(saved) : SEED_CHORES;
          });

          const [groceryList, setGroceryList] = useState([]);
          const [searchQuery, setSearchQuery] = useState('');
          const [recipeFilter, setRecipeFilter] = useState({ mealPrep: 'all', genre: 'all' });
          const [showFilter, setShowFilter] = useState('all');
          const [selectedRecipe, setSelectedRecipe] = useState(null);
          const [showAddRecipe, setShowAddRecipe] = useState(false);
          const [showAddShow, setShowAddShow] = useState(false);
          const [showAddChore, setShowAddChore] = useState(false);
          const [editingItem, setEditingItem] = useState(null);

          // Save to localStorage whenever data changes
          useEffect(() => {
            localStorage.setItem('recipes', JSON.stringify(recipes));
          }, [recipes]);

          useEffect(() => {
            localStorage.setItem('shows', JSON.stringify(shows));
          }, [shows]);

          useEffect(() => {
            localStorage.setItem('choreTemplates', JSON.stringify(choreTemplates));
          }, [choreTemplates]);

          useEffect(() => {
            const storedPIN = localStorage.getItem('familyPIN');
            if (storedPIN) setFamilyPIN(storedPIN);
          }, []);

          const handleLogout = () => {
            if (confirm('Logout?')) {
              localStorage.removeItem('familyPIN');
              setFamilyPIN(null);
            }
          };

          // Recipe CRUD
          const addRecipe = (recipe) => {
            const newRecipe = { ...recipe, id: Date.now() };
            setRecipes([...recipes, newRecipe]);
            setShowAddRecipe(false);
          };

          const updateRecipe = (id, updatedRecipe) => {
            setRecipes(recipes.map(r => r.id === id ? { ...updatedRecipe, id } : r));
            setEditingItem(null);
          };

          const deleteRecipe = (id) => {
            if (confirm('Delete this recipe?')) {
              setRecipes(recipes.filter(r => r.id !== id));
            }
          };

          // Show CRUD
          const addShow = (show) => {
            const newShow = { ...show, id: Date.now() };
            setShows([...shows, newShow]);
            setShowAddShow(false);
          };

          const updateShow = (id, updatedShow) => {
            setShows(shows.map(s => s.id === id ? { ...updatedShow, id } : s));
            setEditingItem(null);
          };

          const deleteShow = (id) => {
            if (confirm('Delete this show?')) {
              setShows(shows.filter(s => s.id !== id));
            }
          };

          // Chore CRUD
          const addChoreTemplate = (chore) => {
            const newChore = { ...chore, id: Date.now() };
            setChoreTemplates([...choreTemplates, newChore]);
            setShowAddChore(false);
          };

          const updateChoreTemplate = (id, updatedChore) => {
            setChoreTemplates(choreTemplates.map(c => c.id === id ? { ...updatedChore, id } : c));
            setEditingItem(null);
          };

          const deleteChoreTemplate = (id) => {
            if (confirm('Delete this chore?')) {
              setChoreTemplates(choreTemplates.filter(c => c.id !== id));
            }
          };

          const filteredRecipes = recipes.filter(r => {
            if (recipeFilter.mealPrep !== 'all' && r.mealPrep.toString() !== recipeFilter.mealPrep) return false;
            if (recipeFilter.genre !== 'all' && r.genre !== recipeFilter.genre) return false;
            if (searchQuery && !r.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
            return true;
          });

          let displayShows = showFilter === 'all' ? shows : showFilter === 'yahya' ? shows.filter(s => s.age.includes('5+') || s.age.includes('7+') || s.age.includes('8+')) : shows.filter(s => s.age.includes('2+') || s.age.includes('3+'));
          
          if (searchQuery) displayShows = displayShows.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase()));

          if (!familyPIN) return <Login onLogin={setFamilyPIN} />;

          return (
            <div className="flex flex-col h-screen bg-gray-50">
              <div className="gradient-bg text-white p-4 shadow-lg">
                <div className="flex justify-between items-center">
                  <div>
                    <h1 className="text-2xl font-bold">Life Admin</h1>
                    <p className="text-sm opacity-90">✓ {recipes.length} recipes • {shows.length} shows • {choreTemplates.length} chores</p>
                  </div>
                  <button onClick={handleLogout} className="p-2 hover:bg-white/20 rounded-lg"><LogOut size={20} /></button>
                </div>
              </div>

              <div className="flex bg-white border-b overflow-x-auto">
                <button onClick={() => setActiveTab('recipes')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'recipes' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <ChefHat size={18} />
                  <span>Recipes</span>
                </button>
                <button onClick={() => setActiveTab('shows')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'shows' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <Tv size={18} />
                  <span>Shows</span>
                </button>
                <button onClick={() => setActiveTab('chores')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'chores' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <Trash2 size={18} />
                  <span>Chores</span>
                </button>
                <button onClick={() => setActiveTab('grocery')} className={`flex-1 min-w-[70px] py-3 px-2 flex flex-col items-center gap-1 text-xs ${activeTab === 'grocery' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <ShoppingCart size={18} />
                  <span>Grocery</span>
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-4">
                {activeTab === 'recipes' && (
                  <div>
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="text-2xl font-bold">Recipes ({filteredRecipes.length})</h2>
                      <button onClick={() => setShowAddRecipe(true)} className="gradient-bg text-white px-4 py-2 rounded-lg flex items-center gap-2">
                        <Plus size={20} />
                        Add Recipe
                      </button>
                    </div>

                    <input type="text" placeholder="Search recipes..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full p-2 border rounded-lg mb-3" />

                    <div className="grid grid-cols-2 gap-2 mb-4">
                      <select value={recipeFilter.mealPrep} onChange={(e) => setRecipeFilter({...recipeFilter, mealPrep: e.target.value})} className="p-2 border rounded-lg">
                        <option value="all">All</option>
                        <option value="true">Meal Prep</option>
                        <option value="false">Fresh</option>
                      </select>
                      <select value={recipeFilter.genre} onChange={(e) => setRecipeFilter({...recipeFilter, genre: e.target.value})} className="p-2 border rounded-lg">
                        <option value="all">All Cuisines</option>
                        <option value="Mexican">Mexican</option>
                        <option value="Italian">Italian</option>
                        <option value="Indian">Indian</option>
                        <option value="American">American</option>
                      </select>
                    </div>

                    <div className="space-y-3">
                      {filteredRecipes.map(recipe => (
                        <div key={recipe.id} className="bg-white p-4 rounded-lg shadow border">
                          <div className="flex justify-between items-start mb-2">
                            <h3 className="font-bold text-lg cursor-pointer" onClick={() => setSelectedRecipe(recipe)}>{recipe.name}</h3>
                            <div className="flex gap-2">
                              <button onClick={() => setEditingItem({ type: 'recipe', data: recipe })} className="text-blue-600 p-1"><Edit size={18} /></button>
                              <button onClick={() => deleteRecipe(recipe.id)} className="text-red-600 p-1"><Trash2 size={18} /></button>
                            </div>
                          </div>
                          <p className="text-sm text-gray-600">{recipe.genre} • {recipe.mealType} • Serves {recipe.servings}</p>
                          {recipe.macros?.calories && <p className="text-xs text-gray-500">🔥 {recipe.macros.calories} cal • 💪 {recipe.macros.protein}g protein</p>}
                        </div>
                      ))}
                    </div>

                    {/* Add Recipe Modal */}
                    {showAddRecipe && <RecipeForm onSave={addRecipe} onCancel={() => setShowAddRecipe(false)} />}
                    
                    {/* Edit Recipe Modal */}
                    {editingItem?.type === 'recipe' && <RecipeForm recipe={editingItem.data} onSave={(updated) => updateRecipe(editingItem.data.id, updated)} onCancel={() => setEditingItem(null)} />}

                    {/* View Recipe Modal */}
                    {selectedRecipe && (
                      <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={() => setSelectedRecipe(null)}>
                        <div className="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6" onClick={(e) => e.stopPropagation()}>
                          <div className="flex justify-between items-start mb-4">
                            <h2 className="text-2xl font-bold">{selectedRecipe.name}</h2>
                            <button onClick={() => setSelectedRecipe(null)} className="text-gray-500"><X size={24} /></button>
                          </div>
                          <div className="space-y-4">
                            <div>
                              <h3 className="font-bold">Details</h3>
                              <p className="text-sm">Serves {selectedRecipe.servings} • {selectedRecipe.cookingMethod} • {selectedRecipe.storage}</p>
                            </div>
                            {selectedRecipe.ingredients && (
                              <div>
                                <h3 className="font-bold">Ingredients</h3>
                                <ul className="text-sm space-y-1">
                                  {selectedRecipe.ingredients.map((ing, i) => <li key={i}>• {ing}</li>)}
                                </ul>
                              </div>
                            )}
                            {selectedRecipe.instructions && (
                              <div>
                                <h3 className="font-bold">Instructions</h3>
                                <p className="text-sm">{selectedRecipe.instructions}</p>
                              </div>
                            )}
                            {selectedRecipe.link && <a href={selectedRecipe.link} target="_blank" className="inline-block gradient-bg text-white px-4 py-2 rounded-lg">View Original</a>}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'shows' && (
                  <div>
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="text-2xl font-bold">TV Shows ({displayShows.length})</h2>
                      <button onClick={() => setShowAddShow(true)} className="gradient-bg text-white px-4 py-2 rounded-lg flex items-center gap-2">
                        <Plus size={20} />
                        Add Show
                      </button>
                    </div>

                    <div className="mb-4 space-y-3">
                      <div className="flex gap-2">
                        <button onClick={() => setShowFilter('all')} className={`flex-1 py-2 rounded-lg ${showFilter === 'all' ? 'gradient-bg text-white' : 'bg-gray-200'}`}>All</button>
                        <button onClick={() => setShowFilter('yahya')} className={`flex-1 py-2 rounded-lg ${showFilter === 'yahya' ? 'gradient-bg text-white' : 'bg-gray-200'}`}>Yahya</button>
                        <button onClick={() => setShowFilter('sofiya')} className={`flex-1 py-2 rounded-lg ${showFilter === 'sofiya' ? 'gradient-bg text-white' : 'bg-gray-200'}`}>Sofiya</button>
                      </div>
                      <input type="text" placeholder="Search shows..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full p-2 border rounded-lg" />
                    </div>

                    <div className="space-y-2">
                      {displayShows.map(show => (
                        <div key={show.id} className="bg-white p-3 rounded-lg shadow border">
                          <div className="flex justify-between items-start mb-2">
                            <div className="flex-1">
                              <div className="flex justify-between items-start">
                                <span className="font-medium">{show.name}</span>
                                <div className="flex gap-2">
                                  <button onClick={() => setEditingItem({ type: 'show', data: show })} className="text-blue-600"><Edit size={16} /></button>
                                  <button onClick={() => deleteShow(show.id)} className="text-red-600"><Trash2 size={16} /></button>
                                </div>
                              </div>
                              <span className="text-xs bg-gray-200 px-2 py-1 rounded">{show.platform}</span>
                            </div>
                          </div>
                          <p className="text-xs text-gray-600">{show.teaches}</p>
                          <div className="flex gap-2 mt-2">
                            <span className="text-xs px-2 py-1 rounded-full bg-blue-100 text-blue-800">{show.category}</span>
                            <span className="text-xs px-2 py-1 rounded-full bg-gray-100">{show.age}</span>
                          </div>
                        </div>
                      ))}
                    </div>

                    {showAddShow && <ShowForm onSave={addShow} onCancel={() => setShowAddShow(false)} />}
                    {editingItem?.type === 'show' && <ShowForm show={editingItem.data} onSave={(updated) => updateShow(editingItem.data.id, updated)} onCancel={() => setEditingItem(null)} />}
                  </div>
                )}

                {activeTab === 'chores' && (
                  <div>
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="text-2xl font-bold">Chore Templates ({choreTemplates.length})</h2>
                      <button onClick={() => setShowAddChore(true)} className="gradient-bg text-white px-4 py-2 rounded-lg flex items-center gap-2">
                        <Plus size={20} />
                        Add Chore
                      </button>
                    </div>

                    <div className="space-y-2">
                      {choreTemplates.map(chore => (
                        <div key={chore.id} className="bg-white p-3 rounded-lg shadow border">
                          <div className="flex justify-between items-start">
                            <div className="flex-1">
                              <h3 className="font-medium">{chore.name}</h3>
                              <p className="text-xs text-gray-600">{chore.frequency} • {chore.assignees.join(', ')}</p>
                            </div>
                            <div className="flex gap-2">
                              <button onClick={() => setEditingItem({ type: 'chore', data: chore })} className="text-blue-600"><Edit size={16} /></button>
                              <button onClick={() => deleteChoreTemplate(chore.id)} className="text-red-600"><Trash2 size={16} /></button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>

                    {showAddChore && <ChoreForm onSave={addChoreTemplate} onCancel={() => setShowAddChore(false)} />}
                    {editingItem?.type === 'chore' && <ChoreForm chore={editingItem.data} onSave={(updated) => updateChoreTemplate(editingItem.data.id, updated)} onCancel={() => setEditingItem(null)} />}
                  </div>
                )}

                {activeTab === 'grocery' && (
                  <div>
                    <h2 className="text-2xl font-bold mb-4">Grocery List</h2>
                    <p className="text-gray-600">Coming soon - meal planning integration</p>
                  </div>
                )}
              </div>
            </div>
          );
        };

        // Recipe Form Component
        const RecipeForm = ({ recipe, onSave, onCancel }) => {
          const [formData, setFormData] = useState(recipe || {
            name: '',
            mealPrep: true,
            mealType: 'Dinner',
            genre: 'Mexican',
            storage: 'Freeze 3+ months',
            cookingMethod: 'Stovetop',
            servings: 4,
            macros: { calories: '', protein: '', carbs: '', fat: '' },
            link: '',
            ingredients: [''],
            instructions: '',
            reheating: ''
          });

          const handleSubmit = (e) => {
            e.preventDefault();
            onSave(formData);
          };

          const addIngredient = () => {
            setFormData({ ...formData, ingredients: [...formData.ingredients, ''] });
          };

          const updateIngredient = (index, value) => {
            const newIngredients = [...formData.ingredients];
            newIngredients[index] = value;
            setFormData({ ...formData, ingredients: newIngredients });
          };

          return (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={onCancel}>
              <div className="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6" onClick={(e) => e.stopPropagation()}>
                <h2 className="text-2xl font-bold mb-4">{recipe ? 'Edit Recipe' : 'Add Recipe'}</h2>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <input type="text" placeholder="Recipe Name" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full p-2 border rounded-lg" required />
                  
                  <div className="grid grid-cols-2 gap-2">
                    <select value={formData.genre} onChange={(e) => setFormData({...formData, genre: e.target.value})} className="p-2 border rounded-lg">
                      <option>Mexican</option>
                      <option>Italian</option>
                      <option>Indian</option>
                      <option>American</option>
                      <option>Asian</option>
                      <option>Mediterranean</option>
                    </select>
                    <select value={formData.mealType} onChange={(e) => setFormData({...formData, mealType: e.target.value})} className="p-2 border rounded-lg">
                      <option>Breakfast</option>
                      <option>Lunch</option>
                      <option>Dinner</option>
                      <option>Lunch/Dinner</option>
                      <option>Snack</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="Servings" value={formData.servings} onChange={(e) => setFormData({...formData, servings: e.target.value})} className="p-2 border rounded-lg" />
                    <select value={formData.cookingMethod} onChange={(e) => setFormData({...formData, cookingMethod: e.target.value})} className="p-2 border rounded-lg">
                      <option>Stovetop</option>
                      <option>Oven</option>
                      <option>Slow Cooker</option>
                      <option>Sheet Pan</option>
                      <option>Grill</option>
                      <option>Air Fryer</option>
                    </select>
                  </div>

                  <label className="flex items-center gap-2">
                    <input type="checkbox" checked={formData.mealPrep} onChange={(e) => setFormData({...formData, mealPrep: e.target.checked})} />
                    <span>Meal Prep Friendly</span>
                  </label>

                  <input type="text" placeholder="Storage (e.g., Freeze 3+ months)" value={formData.storage} onChange={(e) => setFormData({...formData, storage: e.target.value})} className="w-full p-2 border rounded-lg" />

                  <div>
                    <label className="font-bold block mb-2">Ingredients</label>
                    {formData.ingredients.map((ing, i) => (
                      <input key={i} type="text" value={ing} onChange={(e) => updateIngredient(i, e.target.value)} placeholder={`Ingredient ${i + 1}`} className="w-full p-2 border rounded-lg mb-2" />
                    ))}
                    <button type="button" onClick={addIngredient} className="text-blue-600 text-sm">+ Add Ingredient</button>
                  </div>

                  <textarea placeholder="Instructions" value={formData.instructions} onChange={(e) => setFormData({...formData, instructions: e.target.value})} className="w-full p-2 border rounded-lg" rows="3"></textarea>
                  
                  <input type="text" placeholder="Reheating instructions" value={formData.reheating} onChange={(e) => setFormData({...formData, reheating: e.target.value})} className="w-full p-2 border rounded-lg" />
                  
                  <input type="url" placeholder="Recipe Link (optional)" value={formData.link} onChange={(e) => setFormData({...formData, link: e.target.value})} className="w-full p-2 border rounded-lg" />

                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 gradient-bg text-white py-2 rounded-lg">Save Recipe</button>
                    <button type="button" onClick={onCancel} className="flex-1 bg-gray-200 py-2 rounded-lg">Cancel</button>
                  </div>
                </form>
              </div>
            </div>
          );
        };

        // Show Form Component
        const ShowForm = ({ show, onSave, onCancel }) => {
          const [formData, setFormData] = useState(show || {
            name: '',
            platform: 'Netflix',
            category: 'Classic',
            age: '5+',
            teaches: ''
          });

          const handleSubmit = (e) => {
            e.preventDefault();
            onSave(formData);
          };

          return (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={onCancel}>
              <div className="bg-white rounded-lg max-w-md w-full p-6" onClick={(e) => e.stopPropagation()}>
                <h2 className="text-2xl font-bold mb-4">{show ? 'Edit Show' : 'Add Show'}</h2>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <input type="text" placeholder="Show Name" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full p-2 border rounded-lg" required />
                  
                  <select value={formData.platform} onChange={(e) => setFormData({...formData, platform: e.target.value})} className="w-full p-2 border rounded-lg">
                    <option>Netflix</option>
                    <option>Disney+</option>
                    <option>PBS Kids</option>
                    <option>Paramount+</option>
                    <option>Prime</option>
                    <option>HBO Max</option>
                    <option>Apple TV+</option>
                    <option>YouTube</option>
                  </select>

                  <div className="grid grid-cols-2 gap-2">
                    <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className="p-2 border rounded-lg">
                      <option>Classic</option>
                      <option>Science</option>
                      <option>Math</option>
                      <option>Reading</option>
                      <option>Social</option>
                      <option>Adventure</option>
                    </select>
                    <select value={formData.age} onChange={(e) => setFormData({...formData, age: e.target.value})} className="p-2 border rounded-lg">
                      <option>2+</option>
                      <option>3+</option>
                      <option>5+</option>
                      <option>7+</option>
                      <option>8+</option>
                    </select>
                  </div>

                  <input type="text" placeholder="What it teaches" value={formData.teaches} onChange={(e) => setFormData({...formData, teaches: e.target.value})} className="w-full p-2 border rounded-lg" />

                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 gradient-bg text-white py-2 rounded-lg">Save Show</button>
                    <button type="button" onClick={onCancel} className="flex-1 bg-gray-200 py-2 rounded-lg">Cancel</button>
                  </div>
                </form>
              </div>
            </div>
          );
        };

        // Chore Form Component
        const ChoreForm = ({ chore, onSave, onCancel }) => {
          const [formData, setFormData] = useState(chore || {
            name: '',
            frequency: 'daily',
            day: 0,
            assignees: ['Nizam'],
            time: 'morning'
          });

          const handleSubmit = (e) => {
            e.preventDefault();
            onSave(formData);
          };

          const toggleAssignee = (person) => {
            if (formData.assignees.includes(person)) {
              setFormData({...formData, assignees: formData.assignees.filter(a => a !== person)});
            } else {
              setFormData({...formData, assignees: [...formData.assignees, person]});
            }
          };

          return (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={onCancel}>
              <div className="bg-white rounded-lg max-w-md w-full p-6" onClick={(e) => e.stopPropagation()}>
                <h2 className="text-2xl font-bold mb-4">{chore ? 'Edit Chore' : 'Add Chore'}</h2>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <input type="text" placeholder="Chore Name" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full p-2 border rounded-lg" required />
                  
                  <select value={formData.frequency} onChange={(e) => setFormData({...formData, frequency: e.target.value})} className="w-full p-2 border rounded-lg">
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                  </select>

                  {formData.frequency === 'weekly' && (
                    <select value={formData.day} onChange={(e) => setFormData({...formData, day: parseInt(e.target.value)})} className="w-full p-2 border rounded-lg">
                      <option value="0">Sunday</option>
                      <option value="1">Monday</option>
                      <option value="2">Tuesday</option>
                      <option value="3">Wednesday</option>
                      <option value="4">Thursday</option>
                      <option value="5">Friday</option>
                      <option value="6">Saturday</option>
                    </select>
                  )}

                  {formData.frequency === 'daily' && (
                    <select value={formData.time} onChange={(e) => setFormData({...formData, time: e.target.value})} className="w-full p-2 border rounded-lg">
                      <option value="morning">Morning</option>
                      <option value="evening">Evening</option>
                    </select>
                  )}

                  <div>
                    <label className="font-bold block mb-2">Assignees</label>
                    <div className="space-y-2">
                      {['Nizam', 'Rabika', 'Yahya', 'Sofiya'].map(person => (
                        <label key={person} className="flex items-center gap-2">
                          <input type="checkbox" checked={formData.assignees.includes(person)} onChange={() => toggleAssignee(person)} />
                          <span>{person}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 gradient-bg text-white py-2 rounded-lg">Save Chore</button>
                    <button type="button" onClick={onCancel} className="flex-1 bg-gray-200 py-2 rounded-lg">Cancel</button>
                  </div>
                </form>
              </div>
            </div>
          );
        };

        ReactDOM.render(<LifeAdmin />, document.getElementById('root'));
    </script>
</body>
</html>
