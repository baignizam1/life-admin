<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Life Admin">
    <title>Life Admin - Family AI Assistant</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }
        #root {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        @supports (-webkit-touch-callout: none) {
            #root {
                height: -webkit-fill-available;
            }
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const Calendar = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        );
        
        const MessageSquare = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
        );
        
        const List = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
        );
        
        const CheckSquare = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="9 11 12 14 22 4"></polyline>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
        );
        
        const Clock = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        );
        
        const Share2 = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
        );
        
        const Users = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
        );

        const LogOut = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        );

        const Smartphone = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
        );

        const Login = ({ onLogin }) => {
          const [pin, setPin] = useState('');
          const [error, setError] = useState('');

          const handleSubmit = (e) => {
            e.preventDefault();
            if (pin.length < 4) {
              setError('PIN must be at least 4 characters');
              return;
            }
            localStorage.setItem('familyPIN', pin);
            onLogin(pin);
          };

          return (
            <div className="h-screen gradient-bg flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                <div className="text-center mb-8">
                  <div className="w-20 h-20 bg-gradient-to-br from-blue-600 to-purple-600 rounded-full mx-auto mb-4 flex items-center justify-center">
                    <Users size={40} className="text-white" />
                  </div>
                  <h1 className="text-3xl font-bold text-gray-800 mb-2">Life Admin</h1>
                  <p className="text-gray-600">Family AI Assistant</p>
                </div>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Enter Family PIN
                    </label>
                    <input
                      type="text"
                      value={pin}
                      onChange={(e) => setPin(e.target.value)}
                      placeholder="e.g., NizamFamily2025"
                      className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                      autoFocus
                    />
                    {error && <p className="text-red-600 text-sm mt-2">{error}</p>}
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:shadow-lg transition-all"
                  >
                    Access Family Account
                  </button>
                </form>

                <div className="mt-6 p-4 bg-blue-50 rounded-lg">
                  <p className="text-sm text-blue-800">
                    <strong>First time?</strong> Create a family PIN that everyone will use.
                    <br/><br/>
                    <strong>Already have a PIN?</strong> Enter it to sync across all your devices.
                  </p>
                </div>

                <div className="mt-6 text-center text-sm text-gray-600">
                  <Smartphone size={16} className="inline mr-2" />
                  Works on iPhone, Android, and Desktop
                </div>
              </div>
            </div>
          );
        };

        const LifeAdmin = () => {
          const [familyPIN, setFamilyPIN] = useState(null);
          const [messages, setMessages] = useState([]);
          const [input, setInput] = useState('');
          const [isLoading, setIsLoading] = useState(false);
          const [activeTab, setActiveTab] = useState('chat');
          const [events, setEvents] = useState([]);
          const [tasks, setTasks] = useState([]);
          const [syncStatus, setSyncStatus] = useState('synced');
          const messagesEndRef = useRef(null);

          const [family] = useState({
            members: [
              { name: 'Nizam', relation: 'me', age: 37 },
              { name: 'Rabika', relation: 'wife', age: 35 },
              { name: 'Yahya', relation: 'son', age: 5 },
              { name: 'Sofiya', relation: 'daughter', age: 3 }
            ],
            recurringSchedule: [
              {
                title: "Yahya - Jiu Jitsu",
                location: "Kaizen, Hoffman Estates",
                days: [1, 2, 4],
                startTime: "17:00",
                endTime: "18:00",
                category: "kids",
                person: "Yahya"
              },
              {
                title: "Yahya - Sunday School",
                location: "ISNS",
                days: [0],
                startTime: "09:30",
                endTime: "12:30",
                category: "kids",
                person: "Yahya"
              },
              {
                title: "Yahya - School",
                location: "Blooming Minds, Schaumburg",
                days: [1, 2, 3, 4, 5],
                startTime: "08:00",
                endTime: "16:30",
                category: "kids",
                person: "Yahya"
              },
              {
                title: "Sofiya - School",
                location: "Blooming Minds, Schaumburg",
                days: [1, 2, 3, 4, 5],
                startTime: "08:00",
                endTime: "16:30",
                category: "kids",
                person: "Sofiya"
              }
            ]
          });

          useEffect(() => {
            const storedPIN = localStorage.getItem('familyPIN');
            if (storedPIN) {
              setFamilyPIN(storedPIN);
            }
          }, []);

          useEffect(() => {
            if (!familyPIN) return;

            const loadData = () => {
              const key = `lifeAdmin_${familyPIN}`;
              const savedData = localStorage.getItem(key);
              
              if (savedData) {
                const data = JSON.parse(savedData);
                setEvents(data.events || []);
                setTasks(data.tasks || []);
                setMessages(data.messages || []);
              }
            };

            loadData();

            const syncInterval = setInterval(() => {
              loadData();
            }, 2000);

            return () => clearInterval(syncInterval);
          }, [familyPIN]);

          const saveToCloud = (newEvents, newTasks, newMessages) => {
            if (!familyPIN) return;
            
            const key = `lifeAdmin_${familyPIN}`;
            const data = {
              events: newEvents,
              tasks: newTasks,
              messages: newMessages,
              lastUpdated: new Date().toISOString()
            };
            
            localStorage.setItem(key, JSON.stringify(data));
            setSyncStatus('synced');
          };

          useEffect(() => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          }, [messages]);

          const shareToCalendar = async (event) => {
            const formatDate = (date) => {
              return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            };

            const startDate = new Date(event.startTime);
            const endDate = new Date(event.endTime);

            const icsContent = [
              'BEGIN:VCALENDAR',
              'VERSION:2.0',
              'PRODID:-//Life Admin//EN',
              'CALSCALE:GREGORIAN',
              'METHOD:PUBLISH',
              'BEGIN:VEVENT',
              `UID:${event.id}@lifeadmin.app`,
              `DTSTAMP:${formatDate(new Date())}`,
              `DTSTART:${formatDate(startDate)}`,
              `DTEND:${formatDate(endDate)}`,
              `SUMMARY:${event.title}`,
              event.location ? `LOCATION:${event.location}` : '',
              event.description ? `DESCRIPTION:${event.description}` : '',
              'STATUS:CONFIRMED',
              'END:VEVENT',
              'END:VCALENDAR'
            ].filter(line => line).join('\r\n');

            if (navigator.share) {
              try {
                const file = new File([icsContent], `${event.title}.ics`, {
                  type: 'text/calendar',
                });
                
                await navigator.share({
                  files: [file],
                  title: event.title,
                  text: `Add ${event.title} to your calendar`
                });
              } catch (err) {
                if (err.name !== 'AbortError') {
                  downloadICS(event, icsContent);
                }
              }
            } else {
              downloadICS(event, icsContent);
            }
          };

          const downloadICS = (event, icsContent) => {
            const blob = new Blob([icsContent], { type: 'text/calendar' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `${event.title.replace(/\s+/g, '_')}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
          };

          const processUserMessage = async (userMessage) => {
            const newMessages = [...messages, { role: 'user', content: userMessage }];
            setMessages(newMessages);
            setIsLoading(true);
            setSyncStatus('syncing');

            try {
              const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  model: 'claude-sonnet-4-20250514',
                  max_tokens: 2000,
                  messages: [
                    ...newMessages,
                    {
                      role: 'user',
                      content: `You are a personal AI assistant managing a life admin app for the Nizam family.

FAMILY MEMBERS:
${family.members.map(m => `- ${m.name} (${m.relation}, ${m.age} years old)`).join('\n')}

RECURRING FAMILY SCHEDULE (for reference):
${family.recurringSchedule.map(s => 
  `- ${s.title} at ${s.location} (${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].filter((d,i) => s.days.includes(i)).join(', ')}) from ${s.startTime} to ${s.endTime}`
).join('\n')}

CURRENT EVENTS: ${JSON.stringify(events)}
CURRENT TASKS: ${JSON.stringify(tasks)}

The user said: "${userMessage}"

Analyze their message and respond with a JSON object (and ONLY a JSON object, no other text) in this format:
{
  "response": "Your friendly response to the user. Be conversational and reference family members by name when relevant.",
  "actions": [
    {
      "type": "add_event" | "add_task" | "none",
      "data": {
        "title": "Event title",
        "startTime": "ISO datetime string",
        "endTime": "ISO datetime string",
        "location": "Location (optional)",
        "description": "Description (optional)",
        "category": "family" | "personal" | "kids" | "work",
        "attendees": ["family member names who should attend"]
      }
    }
  ]
}

Be natural and helpful. Remember family context. If someone says "my son" they mean Yahya. If they say "kids" they mean Yahya and Sofiya. If they say "whole family" or "everyone", include all 4 family members.

Today is Friday, November 14, 2025.

CRITICAL: Your ENTIRE response must be ONLY valid JSON. DO NOT include any text before or after the JSON object.`
                    }
                  ]
                })
              });

              const data = await response.json();
              let responseText = data.content[0].text;
              responseText = responseText.replace(/\`\`\`json\n?/g, '').replace(/\`\`\`\n?/g, '').trim();
              
              const claudeResponse = JSON.parse(responseText);

              let updatedEvents = [...events];
              let updatedTasks = [...tasks];

              if (claudeResponse.actions && claudeResponse.actions.length > 0) {
                claudeResponse.actions.forEach(action => {
                  if (action.type === 'add_event' && action.data) {
                    const newEvent = {
                      id: Date.now() + Math.random(),
                      ...action.data,
                      completed: false
                    };
                    updatedEvents.push(newEvent);
                  } else if (action.type === 'add_task' && action.data) {
                    const newTask = {
                      id: Date.now() + Math.random(),
                      ...action.data,
                      completed: false
                    };
                    updatedTasks.push(newTask);
                  }
                });
              }

              const updatedMessages = [...newMessages, { 
                role: 'assistant', 
                content: claudeResponse.response 
              }];

              setEvents(updatedEvents);
              setTasks(updatedTasks);
              setMessages(updatedMessages);
              
              saveToCloud(updatedEvents, updatedTasks, updatedMessages);

            } catch (error) {
              console.error('Error:', error);
              const errorMessages = [...newMessages, { 
                role: 'assistant', 
                content: 'Sorry, I had trouble processing that. Can you try rephrasing?' 
              }];
              setMessages(errorMessages);
              saveToCloud(events, tasks, errorMessages);
            } finally {
              setIsLoading(false);
            }
          };

          const handleSend = async () => {
            if (!input.trim() || isLoading) return;
            const userMessage = input;
            setInput('');
            await processUserMessage(userMessage);
          };

          const handleKeyPress = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              handleSend();
            }
          };

          const toggleTaskComplete = (taskId) => {
            const updatedTasks = tasks.map(task => 
              task.id === taskId ? { ...task, completed: !task.completed } : task
            );
            setTasks(updatedTasks);
            saveToCloud(events, updatedTasks, messages);
          };

          const deleteEvent = (eventId) => {
            const updatedEvents = events.filter(event => event.id !== eventId);
            setEvents(updatedEvents);
            saveToCloud(updatedEvents, tasks, messages);
          };

          const deleteTask = (taskId) => {
            const updatedTasks = tasks.filter(task => task.id !== taskId);
            setTasks(updatedTasks);
            saveToCloud(events, updatedTasks, messages);
          };

          const handleLogout = () => {
            if (confirm('Are you sure you want to log out?')) {
              localStorage.removeItem('familyPIN');
              setFamilyPIN(null);
            }
          };

          const formatDateTime = (dateString) => {
            const date = new Date(dateString);
            return date.toLocaleString('en-US', { 
              month: 'short', 
              day: 'numeric',
              hour: 'numeric',
              minute: '2-digit',
              hour12: true
            });
          };

          const getCategoryColor = (category) => {
            const colors = {
              family: 'bg-blue-100 text-blue-800',
              personal: 'bg-purple-100 text-purple-800',
              kids: 'bg-pink-100 text-pink-800',
              work: 'bg-gray-100 text-gray-800',
              chores: 'bg-orange-100 text-orange-800',
              'meal-prep': 'bg-green-100 text-green-800',
              workout: 'bg-red-100 text-red-800',
              reading: 'bg-indigo-100 text-indigo-800',
              study: 'bg-yellow-100 text-yellow-800',
              jobs: 'bg-teal-100 text-teal-800',
              content: 'bg-cyan-100 text-cyan-800',
              general: 'bg-gray-100 text-gray-800'
            };
            return colors[category] || colors.general;
          };

          if (!familyPIN) {
            return <Login onLogin={setFamilyPIN} />;
          }

          return (
            <div className="flex flex-col h-screen bg-gray-50">
              <div className="gradient-bg text-white p-4 shadow-lg">
                <div className="flex justify-between items-center">
                  <div>
                    <h1 className="text-2xl font-bold">Life Admin</h1>
                    <p className="text-sm opacity-90">
                      {syncStatus === 'syncing' ? '☁️ Syncing...' : '✓ Synced across devices'}
                    </p>
                  </div>
                  <button
                    onClick={handleLogout}
                    className="p-2 hover:bg-white/20 rounded-lg transition-colors"
                    title="Logout"
                  >
                    <LogOut size={20} />
                  </button>
                </div>
              </div>

              <div className="flex bg-white border-b overflow-x-auto">
                <button onClick={() => setActiveTab('chat')} className={`flex-1 min-w-[100px] py-3 px-4 flex items-center justify-center gap-2 ${activeTab === 'chat' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <MessageSquare size={20} />
                  <span className="font-medium">Chat</span>
                </button>
                <button onClick={() => setActiveTab('family')} className={`flex-1 min-w-[100px] py-3 px-4 flex items-center justify-center gap-2 ${activeTab === 'family' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <List size={20} />
                  <span className="font-medium">Family</span>
                </button>
                <button onClick={() => setActiveTab('calendar')} className={`flex-1 min-w-[100px] py-3 px-4 flex items-center justify-center gap-2 ${activeTab === 'calendar' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <Calendar size={20} />
                  <span className="font-medium">Events</span>
                  {events.length > 0 && <span className="bg-blue-600 text-white text-xs rounded-full px-2 py-0.5">{events.length}</span>}
                </button>
                <button onClick={() => setActiveTab('tasks')} className={`flex-1 min-w-[100px] py-3 px-4 flex items-center justify-center gap-2 ${activeTab === 'tasks' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-600'}`}>
                  <CheckSquare size={20} />
                  <span className="font-medium">Tasks</span>
                  {tasks.length > 0 && <span className="bg-blue-600 text-white text-xs rounded-full px-2 py-0.5">{tasks.filter(t => !t.completed).length}</span>}
                </button>
              </div>

              <div className="flex-1 overflow-y-auto">
                {activeTab === 'chat' && (
                  <div className="flex flex-col h-full">
                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                      {messages.length === 0 && (
                        <div className="text-center py-12 text-gray-500">
                          <MessageSquare size={48} className="mx-auto mb-4 opacity-50" />
                          <p className="text-lg font-medium">Start a conversation!</p>
                          <div className="mt-6 text-left max-w-md mx-auto bg-gradient-to-br from-blue-50 to-purple-50 p-4 rounded-lg border border-blue-200">
                            <p className="font-medium text-blue-900 mb-2">Try saying:</p>
                            <ul className="text-sm text-blue-800 space-y-1">
                              <li>• "Tomorrow we have an aqeeqah at Makki Masjid from 2-7pm for the whole family"</li>
                              <li>• "Remind me to meal prep on Sunday"</li>
                            </ul>
                          </div>
                        </div>
                      )}
                      
                      {messages.map((message, index) => (
                        <div key={index} className={`flex ${message.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                          <div className={`max-w-[80%] p-3 rounded-lg ${message.role === 'user' ? 'bg-gradient-to-r from-blue-600 to-purple-600 text-white' : 'bg-white border border-gray-200 text-gray-800 shadow-sm'}`}>
                            {message.content}
                          </div>
                        </div>
                      ))}
                      
                      {isLoading && (
                        <div className="flex justify-start">
                          <div className="bg-white border border-gray-200 text-gray-800 p-3 rounded-lg shadow-sm">
                            <div className="flex gap-1">
                              <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></div>
                              <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></div>
                              <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></div>
                            </div>
                          </div>
                        </div>
                      )}
                      <div ref={messagesEndRef} />
                    </div>

                    <div className="border-t bg-white p-4">
                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={input}
                          onChange={(e) => setInput(e.target.value)}
                          onKeyPress={handleKeyPress}
                          placeholder="Type your message..."
                          className="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                          disabled={isLoading}
                        />
                        <button
                          onClick={handleSend}
                          disabled={!input.trim() || isLoading}
                          className="gradient-bg text-white px-6 py-3 rounded-lg font-medium hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all"
                        >
                          Send
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'family' && (
                  <div className="p-4 space-y-4">
                    <div className="bg-white p-4 rounded-lg shadow border border-gray-200">
                      <h2 className="text-xl font-bold mb-3 text-gray-800">Family Members</h2>
                      <div className="space-y-2">
                        {family.members.map((member, index) => (
                          <div key={index} className="flex items-center gap-3 p-3 bg-gradient-to-r from-blue-50 to-purple-50 rounded-lg">
                            <div className="w-12 h-12 gradient-bg text-white rounded-full flex items-center justify-center font-bold text-lg">
                              {member.name[0]}
                            </div>
                            <div>
                              <p className="font-semibold text-gray-800">{member.name}</p>
                              <p className="text-sm text-gray-600 capitalize">{member.relation} • {member.age} years old</p>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-white p-4 rounded-lg shadow border border-gray-200">
                      <h2 className="text-xl font-bold mb-3 text-gray-800">Weekly Schedule</h2>
                      <div className="space-y-3">
                        {family.recurringSchedule.map((schedule, index) => (
                          <div key={index} className="p-3 bg-gray-50 rounded-lg border border-gray-200">
                            <div className="flex justify-between items-start mb-2">
                              <div>
                                <h3 className="font-semibold text-gray-800">{schedule.title}</h3>
                                <p className="text-sm text-gray-600">📍 {schedule.location}</p>
                              </div>
                              <span className={`text-xs px-2 py-1 rounded-full ${getCategoryColor(schedule.category)}`}>
                                {schedule.person}
                              </span>
                            </div>
                            <div className="flex flex-wrap gap-2 mb-2">
                              {schedule.days.map(dayNum => (
                                <span key={dayNum} className="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">
                                  {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dayNum]}
                                </span>
                              ))}
                            </div>
                            <p className="text-sm text-gray-700">
                              <Clock size={14} className="inline mr-1" />
                              {schedule.startTime} - {schedule.endTime}
                            </p>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-gradient-to-br from-green-50 to-blue-50 p-4 rounded-lg border border-green-200">
                      <p className="text-sm text-gray-700">
                        <strong>🔄 Multi-Device Sync Active</strong>
                        <br/>
                        Your family PIN: <code className="bg-white px-2 py-1 rounded">{familyPIN}</code>
                        <br/>
                        Share this PIN with Rabika!
                      </p>
                    </div>
                  </div>
                )}

                {activeTab === 'calendar' && (
                  <div className="p-4 space-y-3">
                    {events.length === 0 ? (
                      <div className="text-center py-12 text-gray-500">
                        <Calendar size={48} className="mx-auto mb-4 opacity-50" />
                        <p className="text-lg font-medium">No events yet</p>
                        <p className="text-sm mt-2">Chat with me to add your first event!</p>
                      </div>
                    ) : (
                      events
                        .sort((a, b) => new Date(a.startTime) - new Date(b.startTime))
                        .map(event => (
                          <div key={event.id} className="bg-white p-4 rounded-lg shadow border border-gray-200">
                            <div className="flex justify-between items-start mb-2">
                              <div>
                                <h3 className="font-semibold text-lg">{event.title}</h3>
                                {event.location && (
                                  <p className="text-sm text-gray-600 mt-1">📍 {event.location}</p>
                                )}
                              </div>
                              <span className={`text-xs px-2 py-1 rounded-full ${getCategoryColor(event.category)}`}>
                                {event.category}
                              </span>
                            </div>
                            
                            <div className="flex items-center gap-2 text-sm text-gray-600 mb-2">
                              <Clock size={16} />
                              <span>{formatDateTime(event.startTime)} - {formatDateTime(event.endTime)}</span>
                            </div>
                            
                            {event.attendees && event.attendees.length > 0 && (
                              <div className="flex items-center gap-2 mb-3 text-sm text-gray-600">
                                <Users size={16} />
                                <span>{event.attendees.join(', ')}</span>
                              </div>
                            )}
                            
                            <div className="flex gap-2">
                              <button
                                onClick={() => shareToCalendar(event)}
                                className="flex-1 gradient-bg text-white py-2 px-4 rounded-lg hover:shadow-lg flex items-center justify-center gap-2 transition-all"
                              >
                                <Share2 size={16} />
                                Share to Calendar
                              </button>
                              <button
                                onClick={() => deleteEvent(event.id)}
                                className="bg-red-100 text-red-600 py-2 px-4 rounded-lg hover:bg-red-200"
                              >
                                Delete
                              </button>
                            </div>
                          </div>
                        ))
                    )}
                  </div>
                )}

                {activeTab === 'tasks' && (
                  <div className="p-4 space-y-3">
                    {tasks.length === 0 ? (
                      <div className="text-center py-12 text-gray-500">
                        <CheckSquare size={48} className="mx-auto mb-4 opacity-50" />
                        <p className="text-lg font-medium">No tasks yet</p>
                        <p className="text-sm mt-2">Chat with me to add your first task!</p>
                      </div>
                    ) : (
                      tasks.map(task => (
                        <div key={task.id} className="bg-white p-4 rounded-lg shadow border border-gray-200">
                          <div className="flex items-start gap-3">
                            <input
                              type="checkbox"
                              checked={task.completed}
                              onChange={() => toggleTaskComplete(task.id)}
                              className="mt-1 w-5 h-5 text-blue-600 rounded focus:ring-blue-500"
                            />
                            <div className="flex-1">
                              <h3 className={`font-medium ${task.completed ? 'line-through text-gray-400' : ''}`}>
                                {task.title}
                              </h3>
                              {task.assignedTo && (
                                <p className="text-sm text-gray-600 mt-1">👤 {task.assignedTo}</p>
                              )}
                              <div className="flex items-center gap-2 mt-2 flex-wrap">
                                <span className={`text-xs px-2 py-1 rounded-full ${getCategoryColor(task.category)}`}>
                                  {task.category}
                                </span>
                                {task.priority && (
                                  <span className={`text-xs px-2 py-1 rounded-full ${
                                    task.priority === 'high' ? 'bg-red-100 text-red-800' :
                                    task.priority === 'medium' ? 'bg-yellow-100 text-yellow-800' :
                                    'bg-green-100 text-green-800'
                                  }`}>
                                    {task.priority}
                                  </span>
                                )}
                                {task.dueDate && (
                                  <span className="text-xs text-gray-600">
                                    Due: {formatDateTime(task.dueDate)}
                                  </span>
                                )}
                              </div>
                            </div>
                            <button
                              onClick={() => deleteTask(task.id)}
                              className="text-red-600 hover:text-red-800 text-sm"
                            >
                              Delete
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        };

        ReactDOM.render(<LifeAdmin />, document.getElementById('root'));
    </script>
</body>
</html>
